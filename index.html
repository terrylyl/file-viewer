      function createCsvWorker() {
        const source = document.getElementById("csv-worker-source").textContent;
        const blob = new Blob([source], { type: "text/javascript" });
        const workerUrl = URL.createObjectURL(blob);
        const worker = new Worker(workerUrl);
        URL.revokeObjectURL(workerUrl);
        return worker;
      }

      function beginLoad() {
        state.loadToken += 1;
        if (state.worker) state.worker.terminate();
        state.worker = null;
        return state.loadToken;
      }

      function isCurrentLoad(loadToken) {
        return loadToken === state.loadToken;
      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes)) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        let value = bytes;
        let index = 0;
        while (value >= 1024 && index < units.length - 1) {
          value /= 1024;
          index += 1;
        }
        return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
      }

      function delimiterLabel(delimiter) {
        if (delimiter === "\t") return "Tab";
        if (delimiter === ",") return "逗号";
        if (delimiter === ";") return "分号";
        if (delimiter === "|") return "竖线";
        return delimiter || "";
      }

      function setProgress(progress, label) {
        els.progressBar.style.width = `${Math.max(0, Math.min(100, progress * 100))}%`;
        if (label) els.leftStatus.textContent = label;
      }

      function escapeCsv(value) {
        const text = value == null ? "" : String(value);
        if (/[",\r\n\t;]/.test(text)) {
          return `"${text.replaceAll('"', '""')}"`;
        }
        return text;
      }

      function normalizeTextParts(content) {
        return Array.isArray(content) ? content : [content];
      }

      function downloadText(filename, content, mime = "text/csv;charset=utf-8") {
        const blob = new Blob(["\ufeff", ...normalizeTextParts(content)], { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      async function saveTextFile(filename, content, mime = "text/csv;charset=utf-8") {
        const parts = normalizeTextParts(content);
        if (window.showSaveFilePicker) {
          const options = {
            suggestedName: filename,
            types: [
              {
                description: "CSV file",
                accept: { "text/csv": [".csv"] },
              },
            ],
          };
          if (state.sourceFileHandle) options.startIn = state.sourceFileHandle;
          try {
            const handle = await window.showSaveFilePicker(options);
            const writable = await handle.createWritable();
            await writable.write(new Blob(["\ufeff", ...parts], { type: mime }));
            await writable.close();
            els.leftStatus.textContent = "已导出文件";
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
            try {
              const handle = await window.showSaveFilePicker({ suggestedName: filename });
              const writable = await handle.createWritable();
              await writable.write(new Blob(["\ufeff", ...parts], { type: mime }));
              await writable.close();
              els.leftStatus.textContent = "已导出文件";
              return;
            } catch (fallbackError) {
              if (fallbackError && fallbackError.name === "AbortError") return;
            }
          }
        }
        downloadText(filename, parts, mime);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const area = document.createElement("textarea");
          area.value = text;
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        els.leftStatus.textContent = "已复制到剪贴板";
      }

      function getVisibleColumnIndexes() {
        const order = state.columnOrder.length ? state.columnOrder : state.headers.map((_, index) => index);
        return order
          .filter((index) => state.visibleColumns[index]);
      }

      function getCurrentRowHeight() {
        return state.wrapCells ? WRAP_ROW_HEIGHT : ROW_HEIGHT;
      }

      function getTotalWidth() {
        return (
          ROW_NUMBER_WIDTH +
          getVisibleColumnIndexes().reduce((sum, col) => sum + (state.columnWidths[col] || DEFAULT_COL_WIDTH), 0)
        );
      }

      function summarize(value) {
        const text = value == null ? "" : String(value);
        if (text.length <= PREVIEW_LIMIT) return { text, isLong: false };
        return {
          text: `文本过长，已截断显示，点击查看全文 · ${text.slice(0, PREVIEW_LIMIT)}`,
          isLong: true,
        };
      }

      function normalizeForSearch(value, caseSensitive) {
        const text = value == null ? "" : String(value);
        return caseSensitive ? text : text.toLocaleLowerCase();
      }

      function rowMatches(row) {
        const query = els.searchInput.value;
        if (!query) return false;
        const needle = normalizeForSearch(query, els.caseSensitiveInput.checked);
        const selectedColumn = Number(els.searchColumnSelect.value);
        if (selectedColumn >= 0) {
          return normalizeForSearch(row[selectedColumn] || "", els.caseSensitiveInput.checked).includes(needle);
        }
        for (const cell of row) {
          if (normalizeForSearch(cell, els.caseSensitiveInput.checked).includes(needle)) return true;
        }
        return false;
      }

      function getColumnUniqueValues(columnIndex) {
        return getCachedColumnUniqueValues(columnIndex);
      }

      function invalidateColumnValueCache(columnIndex = null) {
        if (columnIndex == null) {
          state.columnValueCache.clear();
          return;
        }
        state.columnValueCache.delete(String(columnIndex));
      }

      function getCachedColumnUniqueValues(columnIndex) {
        const cacheKey = String(columnIndex);
        const cached = state.columnValueCache.get(cacheKey);
        if (cached) return cached;
        const counts = new Map();
        for (const row of state.rows) {
          const value = row[columnIndex] == null ? "" : String(row[columnIndex]);
          counts.set(value, (counts.get(value) || 0) + 1);
        }
        const values = [...counts.entries()]
          .map(([value, count]) => ({ value, count }))
          .sort((a, b) => compareCells(a.value, b.value));
        state.columnValueCache.set(cacheKey, values);
        return values;
      }

      function getColumnFilter(columnIndex) {
        return state.columnFilters[String(columnIndex)] || null;
      }

      function hasColumnFilter(columnIndex) {
        return Boolean(getColumnFilter(columnIndex));
      }

      function cloneColumnFilter(filter) {
        if (!filter) return null;
        if (filter.allowedValues) return { mode: "include", values: new Set(filter.allowedValues) };
        return {
          mode: filter.mode === "exclude" ? "exclude" : "include",
          values: new Set(filter.values || []),
        };
      }

      function isColumnFilterValueSelected(columnIndex, value) {
        const filter = getColumnFilter(columnIndex);
        if (!filter) return true;
        if (filter.allowedValues) return filter.allowedValues.has(value);
        if (filter.mode === "exclude") return !filter.values.has(value);
        return filter.values.has(value);
      }

      function getColumnFilterSelectedCount(columnIndex, allValues) {
        const filter = getColumnFilter(columnIndex);
        if (!filter) return allValues.length;
        if (filter.allowedValues) return Math.min(filter.allowedValues.size, allValues.length);
        if (filter.mode === "exclude") return Math.max(0, allValues.length - filter.values.size);
        return Math.min(filter.values.size, allValues.length);
      }

      function normalizeColumnFilter(columnIndex, filter, allValues = getColumnUniqueValues(columnIndex)) {
        const key = String(columnIndex);
        const next = cloneColumnFilter(filter);
        if (!next) {
          delete state.columnFilters[key];
          return;
        }
        if (next.mode === "exclude") {
          if (!next.values.size) delete state.columnFilters[key];
          else state.columnFilters[key] = next;
          return;
        }
        const selectedEveryValue = allValues.length > 0 && allValues.every((item) => next.values.has(item.value));
        if (selectedEveryValue) {
          delete state.columnFilters[key];
          return;
        }
        state.columnFilters[key] = next;
      }

      function updateColumnFilterValue(columnIndex, value, checked, allValues = getColumnUniqueValues(columnIndex)) {
        let next = cloneColumnFilter(getColumnFilter(columnIndex));
        if (!next) {
          if (checked) return;
          next = { mode: "exclude", values: new Set([value]) };
        } else if (next.mode === "exclude") {
          if (checked) next.values.delete(value);
          else next.values.add(value);
        } else if (checked) {
          next.values.add(value);
        } else {
          next.values.delete(value);
        }
        normalizeColumnFilter(columnIndex, next, allValues);
      }

      function updateColumnFilterValues(columnIndex, items, checked, allValues = getColumnUniqueValues(columnIndex)) {
        if (checked && items.length === allValues.length) {
          clearColumnFilter(columnIndex);
          return;
        }
        const itemValues = items.map((item) => item.value);
        let next = cloneColumnFilter(getColumnFilter(columnIndex));
        if (!next) {
          if (checked) return;
          next = itemValues.length === allValues.length
            ? { mode: "include", values: new Set() }
            : { mode: "exclude", values: new Set(itemValues) };
        } else if (next.mode === "exclude") {
          for (const value of itemValues) {
            if (checked) next.values.delete(value);
            else next.values.add(value);
          }
        } else {
          for (const value of itemValues) {
            if (checked) next.values.add(value);
            else next.values.delete(value);
          }
        }
        normalizeColumnFilter(columnIndex, next, allValues);
      }

      function getActiveColumnFilters() {
        return Object.entries(state.columnFilters).map(([columnKey, filter]) => ({
          columnIndex: Number(columnKey),
          filter,
        }));
      }

      function columnFilterAllowsValue(filter, value) {
        if (!filter) return true;
        if (filter.allowedValues) return filter.allowedValues.has(value);
        if (filter.mode === "exclude") return !filter.values.has(value);
        return filter.values.has(value);
      }

      function rowPassesColumnFilters(row, activeColumnFilters = getActiveColumnFilters()) {
        for (const { columnIndex, filter } of activeColumnFilters) {
          const value = row[columnIndex] == null ? "" : String(row[columnIndex]);
          if (!columnFilterAllowsValue(filter, value)) return false;
        }
        return true;
      }

      function clearColumnFilter(columnIndex) {
        if (columnIndex < 0) return;
        delete state.columnFilters[String(columnIndex)];
      }

      function clearAllColumnFilters() {
        state.columnFilters = {};
      }

      function rowPassesHiddenRows(rowIndex) {
        return !state.hiddenRows.has(rowIndex);
      }

      function rebuildVisibleRowPositionMap() {
        state.rowPositionMap = new Map();
        state.viewIndices.forEach((rowIndex, position) => {
          state.rowPositionMap.set(rowIndex, position);
        });
      }

      function renderFilteredRowStats() {
        const hiddenCount = state.hiddenRows.size;
        const filterCount = Object.keys(state.columnFilters).length;
        const searchActive = Boolean(els.searchInput.value && els.matchedOnlyInput.checked);
        const parts = [`${state.viewIndices.length.toLocaleString()} / ${state.rows.length.toLocaleString()} 行`];
        if (filterCount) parts.push(`${filterCount} 列筛选`);
        if (searchActive) parts.push("搜索筛选");
        if (hiddenCount) parts.push(`隐藏 ${hiddenCount.toLocaleString()} 行`);
        els.filteredRowStats.textContent = parts.join(" · ");
        els.filteredRowStats.classList.toggle("warning", filterCount > 0 || searchActive || hiddenCount > 0);
      }

      function recomputeView() {
        const query = els.searchInput.value;
        const matchedOnly = els.matchedOnlyInput.checked;
        const activeColumnFilters = getActiveColumnFilters();
        state.matchedRows = new Set();
        const base = [];

        for (let index = 0; index < state.rows.length; index += 1) {
          const row = state.rows[index];
          if (!rowPassesHiddenRows(index)) continue;
          if (!rowPassesColumnFilters(row, activeColumnFilters)) continue;
          const hit = query ? rowMatches(row) : false;
          if (hit) state.matchedRows.add(index);
          if (!query || !matchedOnly || hit) base.push(index);
        }

        if (state.sort.column >= 0 && state.sort.direction !== "none") {
          const column = state.sort.column;
          const direction = state.sort.direction === "asc" ? 1 : -1;
          base.sort((a, b) => compareCells(state.rows[a][column], state.rows[b][column]) * direction);
        }

        state.viewIndices = base;
        rebuildVisibleRowPositionMap();
        normalizeSelectionForCurrentView();
        els.rightStatus.textContent = `${state.viewIndices.length} / ${state.rows.length} 行 · ${state.headers.length} 列`;
        renderFilteredRowStats();
        renderColumnOverview();
        renderGrid();
      }

      function compareCells(a, b) {
        const left = a == null ? "" : String(a);
        const right = b == null ? "" : String(b);
        const leftNumber = Number(left);
        const rightNumber = Number(right);
        if (left.trim() !== "" && right.trim() !== "" && Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) {
          return leftNumber - rightNumber;
        }
        return left.localeCompare(right, undefined, { numeric: true, sensitivity: "base" });
      }

      function appendHighlightedText(parent, text, query) {
        const value = text == null ? "" : String(text);
        if (!query) {
          parent.appendChild(document.createTextNode(value));
          return;
        }
        const caseSensitive = els.caseSensitiveInput.checked;
        const haystack = normalizeForSearch(value, caseSensitive);
        const needle = normalizeForSearch(query, caseSensitive);
        if (!needle) {
          parent.appendChild(document.createTextNode(value));
          return;
        }
        let offset = 0;
        let found = haystack.indexOf(needle, offset);
        while (found >= 0) {
          if (found > offset) parent.appendChild(document.createTextNode(value.slice(offset, found)));
          const mark = document.createElement("mark");
          mark.textContent = value.slice(found, found + needle.length);
          parent.appendChild(mark);
          offset = found + needle.length;
          found = haystack.indexOf(needle, offset);
        }
        if (offset < value.length) parent.appendChild(document.createTextNode(value.slice(offset)));
      }

      function appendHighlighted(parent, text, query) {
        parent.textContent = "";
        appendHighlightedText(parent, text, query);
      }

      function normalizeLinkHref(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        let href = text;
        if (/^www\./i.test(href)) href = `https://${href}`;
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/i.test(href)) href = `mailto:${href}`;
        try {
          const url = new URL(href);
          return ["http:", "https:", "mailto:"].includes(url.protocol) ? url.href : "";
        } catch (error) {
          return "";
        }
      }

      function detectCellLinks(text) {
        const value = text == null ? "" : String(text);
        const linkPattern = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/gi;
        const segments = [];
        let offset = 0;
        let match;
        while ((match = linkPattern.exec(value)) !== null) {
          const raw = match[0];
          const trailing = raw.match(/[.,;:!?)]*$/)?.[0] || "";
          const linkText = trailing ? raw.slice(0, -trailing.length) : raw;
          const href = normalizeLinkHref(linkText);
          if (!href) continue;
          if (match.index > offset) segments.push({ text: value.slice(offset, match.index) });
          segments.push({ text: linkText, href });
          if (trailing) segments.push({ text: trailing });
          offset = match.index + raw.length;
        }
        if (offset < value.length) segments.push({ text: value.slice(offset) });
        return segments.some((segment) => segment.href) ? segments : [];
      }

      function appendLinkedText(parent, text, query, forcedHref = "") {
        const value = text == null ? "" : String(text);
        const href = normalizeLinkHref(forcedHref);
        const segments = href ? [{ text: value, href }] : detectCellLinks(value);
        if (!segments.length) {
          appendHighlighted(parent, value, query);
          return;
        }
        parent.textContent = "";
        for (const segment of segments) {
          if (!segment.href) {
            appendHighlightedText(parent, segment.text, query);
            continue;
          }
          const anchor = document.createElement("a");
          anchor.href = segment.href;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.title = segment.href;
          appendHighlightedText(anchor, segment.text, query);
          parent.appendChild(anchor);
        }
      }

      function isDuplicateColumn(columnIndex) {
        return (state.issues.duplicateColumns || []).some((issue) => {
          if (Array.isArray(issue.columnIndexes)) return issue.columnIndexes.includes(columnIndex);
          return issue.columnIndex === columnIndex;
        });
      }

      function isCustomColumn(columnIndex) {
        return state.customColumns.has(columnIndex);
      }

      function getCellMeta(rowIndex, columnIndex) {
        if (!state.cellMeta || !state.cellMeta.size) return null;
        return state.cellMeta.get(`${rowIndex}:${columnIndex}`) || null;
      }

      function applyCellMetaStyle(element, meta) {
        element.style.removeProperty("background-color");
        element.style.removeProperty("color");
        if (!meta) return;
        if (meta.backgroundColor) element.style.backgroundColor = meta.backgroundColor;
        if (meta.color) element.style.color = meta.color;
      }

      function sanitizeStyleAttribute(value) {
        const allowed = new Set(["color", "background-color", "font-weight", "font-style", "text-decoration"]);
        return String(value || "")
          .split(";")
          .map((part) => part.trim())
          .filter(Boolean)
          .map((part) => {
            const splitAt = part.indexOf(":");
            if (splitAt < 0) return "";
            const name = part.slice(0, splitAt).trim().toLowerCase();
            const rawValue = part.slice(splitAt + 1).trim();
            if (!allowed.has(name)) return "";
            if (/url\s*\(|expression\s*\(|javascript:/i.test(rawValue)) return "";
            return `${name}: ${rawValue}`;
          })
          .filter(Boolean)
          .join("; ");
      }

      function appendSanitizedExcelHtml(parent, html) {
        const allowedTags = new Set(["span", "b", "strong", "i", "em", "u", "s", "sub", "sup", "br"]);
        const template = document.createElement("template");
        template.innerHTML = String(html || "");

        const cleanNode = (node) => {
          if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent || "");
          if (node.nodeType !== Node.ELEMENT_NODE) return document.createDocumentFragment();

          const sourceTag = node.tagName.toLowerCase();
          if (sourceTag === "br") return document.createElement("br");
          const targetTag = sourceTag === "font" ? "span" : sourceTag;
          const fragment = document.createDocumentFragment();
          if (!allowedTags.has(targetTag)) {
            for (const child of node.childNodes) fragment.appendChild(cleanNode(child));
            return fragment;
          }

          const element = document.createElement(targetTag);
          const style = sanitizeStyleAttribute(node.getAttribute("style"));
          if (style) element.setAttribute("style", style);
          if (sourceTag === "font") {
            const color = node.getAttribute("color");
            if (color && !/url\s*\(|expression\s*\(|javascript:/i.test(color)) element.style.color = color;
          }
          for (const child of node.childNodes) element.appendChild(cleanNode(child));
          return element;
        };

        for (const child of template.content.childNodes) parent.appendChild(cleanNode(child));
      }

      function renderCellDisplayContent(container, value, query, meta, options = {}) {
        container.innerHTML = "";
        const text = value == null ? "" : String(value);
        applyCellMetaStyle(container, meta);
        const hasInlineLink = Boolean(meta?.link) || detectCellLinks(text).length > 0;
        if (meta?.html && options.allowHtml && !query && !hasInlineLink) {
          appendSanitizedExcelHtml(container, meta.html);
          return;
        }
        appendLinkedText(container, text, query, meta?.link || "");
      }

      function getVisibleRowPosition(rowIndex) {
        return state.rowPositionMap.get(rowIndex) ?? -1;
      }

      function getVisibleColumnPosition(columnIndex) {
        return getVisibleColumnIndexes().indexOf(columnIndex);
      }

      function getFirstVisibleCell() {
        const columns = getVisibleColumnIndexes();
        if (!state.viewIndices.length || !columns.length) return null;
        return { rowIndex: state.viewIndices[0], columnIndex: columns[0] };
      }

      function getSelectionEndpoints(range = state.selectionRange) {
        if (!range) return null;
        const columns = getVisibleColumnIndexes();
        if (!state.viewIndices.length || !columns.length) return null;
        if (range.type === "all") {
          return {
            startRowPosition: 0,
            endRowPosition: state.viewIndices.length - 1,
            startColumnPosition: 0,
            endColumnPosition: columns.length - 1,
          };
        }
        const anchorRowPosition = range.anchorRowIndex == null ? 0 : getVisibleRowPosition(range.anchorRowIndex);
        const focusRowPosition = range.focusRowIndex == null ? state.viewIndices.length - 1 : getVisibleRowPosition(range.focusRowIndex);
        const anchorColumnPosition = range.anchorColumnIndex == null ? 0 : getVisibleColumnPosition(range.anchorColumnIndex);
        const focusColumnPosition = range.focusColumnIndex == null ? columns.length - 1 : getVisibleColumnPosition(range.focusColumnIndex);
        const rowA = range.type === "columns" ? 0 : anchorRowPosition;
        const rowB = range.type === "columns" ? state.viewIndices.length - 1 : focusRowPosition;
        const colA = range.type === "rows" ? 0 : anchorColumnPosition;
        const colB = range.type === "rows" ? columns.length - 1 : focusColumnPosition;
        if (rowA < 0 || rowB < 0 || colA < 0 || colB < 0) return null;
        return {
          startRowPosition: Math.min(rowA, rowB),
          endRowPosition: Math.max(rowA, rowB),
          startColumnPosition: Math.min(colA, colB),
          endColumnPosition: Math.max(colA, colB),
        };
      }

      function isCellInSelection(rowIndex, columnIndex) {
        const endpoints = getSelectionEndpoints();
        if (!endpoints) return false;
        const rowPosition = getVisibleRowPosition(rowIndex);
        const columnPosition = getVisibleColumnPosition(columnIndex);
        return (
          rowPosition >= endpoints.startRowPosition &&
          rowPosition <= endpoints.endRowPosition &&
          columnPosition >= endpoints.startColumnPosition &&
          columnPosition <= endpoints.endColumnPosition
        );
      }

      function isRowInSelection(rowIndex) {
        const endpoints = getSelectionEndpoints();
        if (!endpoints) return false;
        const rowPosition = getVisibleRowPosition(rowIndex);
        return rowPosition >= endpoints.startRowPosition && rowPosition <= endpoints.endRowPosition;
      }

      function isColumnInSelection(columnIndex) {
        const endpoints = getSelectionEndpoints();
        if (!endpoints) return false;
        const columnPosition = getVisibleColumnPosition(columnIndex);
        return columnPosition >= endpoints.startColumnPosition && columnPosition <= endpoints.endColumnPosition;
      }

      function setFocusedCell(rowIndex, columnIndex) {
        state.selected = { rowIndex, columnIndex };
        state.detailVisibleChars = DETAIL_CHUNK;
      }

      function setSelection(range, focusCell = null) {
        state.selectionRange = range;
        if (focusCell) setFocusedCell(focusCell.rowIndex, focusCell.columnIndex);
        else if (!state.selected) {
          const first = getFirstVisibleCell();
          if (first) setFocusedCell(first.rowIndex, first.columnIndex);
        }
      }

      function selectCellRange(anchorRowIndex, anchorColumnIndex, focusRowIndex, focusColumnIndex, options = {}) {
        const focusCell = { rowIndex: focusRowIndex, columnIndex: focusColumnIndex };
        if (!options.preserveAnchor) state.selectionAnchor = { rowIndex: anchorRowIndex, columnIndex: anchorColumnIndex };
        setSelection(
          { type: "range", anchorRowIndex, anchorColumnIndex, focusRowIndex, focusColumnIndex },
          focusCell,
        );
        if (!options.silent) {
          ensureCellVisible(focusRowIndex, focusColumnIndex);
          renderGrid();
          renderDetail();
        }
      }

      function selectRowRange(anchorRowIndex, focusRowIndex, options = {}) {
        const columnIndex = state.selected?.columnIndex ?? getVisibleColumnIndexes()[0] ?? 0;
        if (!options.preserveAnchor) state.selectionAnchor = { rowIndex: anchorRowIndex, columnIndex };
        setSelection(
          { type: "rows", anchorRowIndex, anchorColumnIndex: columnIndex, focusRowIndex, focusColumnIndex: columnIndex },
          { rowIndex: focusRowIndex, columnIndex },
        );
        if (!options.silent) {
          ensureCellVisible(focusRowIndex, columnIndex);
          renderGrid();
          renderDetail();
        }
      }

      function selectColumnRange(anchorColumnIndex, focusColumnIndex, options = {}) {
        const rowIndex = state.selected?.rowIndex ?? state.viewIndices[0] ?? 0;
        if (!options.preserveAnchor) state.selectionAnchor = { rowIndex, columnIndex: anchorColumnIndex };
        setSelection(
          { type: "columns", anchorRowIndex: rowIndex, anchorColumnIndex, focusRowIndex: rowIndex, focusColumnIndex },
          { rowIndex, columnIndex: focusColumnIndex },
        );
        if (!options.silent) {
          ensureCellVisible(rowIndex, focusColumnIndex);
          renderGrid();
          renderDetail();
        }
      }

      function selectAllVisibleCells() {
        const first = getFirstVisibleCell();
        if (!first) return;
        const columns = getVisibleColumnIndexes();
        const last = { rowIndex: state.viewIndices[state.viewIndices.length - 1], columnIndex: columns[columns.length - 1] };
        state.selectionAnchor = first;
        setSelection(
          { type: "all", anchorRowIndex: first.rowIndex, anchorColumnIndex: first.columnIndex, focusRowIndex: last.rowIndex, focusColumnIndex: last.columnIndex },
          first,
        );
        renderGrid();
        renderDetail();
      }

      function clearSelectionToSelected() {
        if (!state.selected) {
          state.selectionAnchor = null;
          state.selectionRange = null;
          return;
        }
        state.selectionAnchor = { ...state.selected };
        state.selectionRange = {
          type: "range",
          anchorRowIndex: state.selected.rowIndex,
          anchorColumnIndex: state.selected.columnIndex,
          focusRowIndex: state.selected.rowIndex,
          focusColumnIndex: state.selected.columnIndex,
        };
      }

      function normalizeSelectionForCurrentView() {
        const columns = getVisibleColumnIndexes();
        const first = getFirstVisibleCell();
        if (!first) {
          state.selected = null;
          clearSelectionToSelected();
          return;
        }
        if (
          !state.selected ||
          !state.rowPositionMap.has(state.selected.rowIndex) ||
          !columns.includes(state.selected.columnIndex)
        ) {
          state.selected = first;
          clearSelectionToSelected();
          return;
        }
        if (!getSelectionEndpoints()) clearSelectionToSelected();
      }

      function ensureCellVisible(rowIndex, columnIndex) {
        const rowPosition = getVisibleRowPosition(rowIndex);
        const visibleColumns = getVisibleColumnIndexes();
        const columnPosition = visibleColumns.indexOf(columnIndex);
        if (rowPosition < 0 || columnPosition < 0) return;
        const rowHeight = getCurrentRowHeight();
        const rowTop = HEADER_HEIGHT + rowPosition * rowHeight;
        const rowBottom = rowTop + rowHeight;
        const viewportTop = els.gridViewport.scrollTop;
        const viewportBottom = viewportTop + els.gridViewport.clientHeight;
        if (rowTop < viewportTop) els.gridViewport.scrollTop = rowTop;
        else if (rowBottom > viewportBottom) els.gridViewport.scrollTop = rowBottom - els.gridViewport.clientHeight;

        let columnLeft = ROW_NUMBER_WIDTH;
        for (let index = 0; index < columnPosition; index += 1) {
          columnLeft += state.columnWidths[visibleColumns[index]] || DEFAULT_COL_WIDTH;
        }
        const columnRight = columnLeft + (state.columnWidths[columnIndex] || DEFAULT_COL_WIDTH);
        const viewportLeft = els.gridViewport.scrollLeft;
        const viewportRight = viewportLeft + els.gridViewport.clientWidth;
        if (columnLeft < viewportLeft + ROW_NUMBER_WIDTH) els.gridViewport.scrollLeft = Math.max(0, columnLeft - ROW_NUMBER_WIDTH);
        else if (columnRight > viewportRight) els.gridViewport.scrollLeft = columnRight - els.gridViewport.clientWidth;
      }

      function moveSelectionByKeyboard(event) {
        const deltas = {
          ArrowUp: [-1, 0],
          ArrowDown: [1, 0],
          ArrowLeft: [0, -1],
          ArrowRight: [0, 1],
        };
        const delta = deltas[event.key];
        if (!delta) return false;
        const columns = getVisibleColumnIndexes();
        if (!state.viewIndices.length || !columns.length) return true;
        const current = state.selected || getFirstVisibleCell();
        let rowPosition = getVisibleRowPosition(current.rowIndex);
        let columnPosition = columns.indexOf(current.columnIndex);
        if (rowPosition < 0) rowPosition = 0;
        if (columnPosition < 0) columnPosition = 0;
        rowPosition = Math.max(0, Math.min(state.viewIndices.length - 1, rowPosition + delta[0]));
        columnPosition = Math.max(0, Math.min(columns.length - 1, columnPosition + delta[1]));
        const next = { rowIndex: state.viewIndices[rowPosition], columnIndex: columns[columnPosition] };
        if (event.shiftKey) {
          const anchor = state.selectionAnchor || current || next;
          selectCellRange(anchor.rowIndex, anchor.columnIndex, next.rowIndex, next.columnIndex, { preserveAnchor: true });
        } else {
          selectCell(next.rowIndex, next.columnIndex);
        }
        return true;
      }

      function handleGridKeyDown(event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "a") {
          event.preventDefault();
          selectAllVisibleCells();
          return;
        }
        if (moveSelectionByKeyboard(event)) event.preventDefault();
      }

      function isEditableShortcutTarget(target) {
        if (!(target instanceof Element)) return false;
        const tagName = target.tagName.toLowerCase();
        return tagName === "input" || tagName === "textarea" || tagName === "select" || target.isContentEditable;
      }

      function handleCopyShortcut(event) {
        if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== "c") return;
        if (isEditableShortcutTarget(event.target)) return;
        if (!state.selected) return;
        event.preventDefault();
        copyText(getSelectionText());
      }

      function handlePasteIntoCustomColumns(event) {
        if (isEditableShortcutTarget(event.target)) return;
        const text = event.clipboardData?.getData("text/plain") || "";
        if (!text) return;
        if (pasteClipboardTextIntoSelection(text)) event.preventDefault();
      }

      function startSelectionDrag(type, anchorRowIndex, anchorColumnIndex, event) {
        if (event.button !== 0) return;
        event.preventDefault();
        els.gridViewport.focus();
        state.selectionDrag = { type, anchorRowIndex, anchorColumnIndex };
        updateSelectionDrag(type, anchorRowIndex, anchorColumnIndex);
      }

      function updateSelectionDrag(type, rowIndex, columnIndex) {
        if (!state.selectionDrag) return;
        const drag = state.selectionDrag;
        if (type === "row" || drag.type === "row") {
          selectRowRange(drag.anchorRowIndex, rowIndex, { preserveAnchor: true });
        } else if (type === "column" || drag.type === "column") {
          selectColumnRange(drag.anchorColumnIndex, columnIndex, { preserveAnchor: true });
        } else {
          selectCellRange(drag.anchorRowIndex, drag.anchorColumnIndex, rowIndex, columnIndex, { preserveAnchor: true });
        }
      }

      function stopSelectionDrag() {
        state.selectionDrag = null;
      }

      function renderHeader() {
        const visibleColumns = getVisibleColumnIndexes();
        els.headerRow.innerHTML = "";
        els.headerRow.style.width = `${getTotalWidth()}px`;
        els.headerRow.style.height = `${HEADER_HEIGHT}px`;

        const rowNumber = document.createElement("div");
        rowNumber.className = `row-number select-all-corner${state.selectionRange?.type === "all" ? " selected-row" : ""}`;
        rowNumber.textContent = "#";
        rowNumber.title = "Select all visible cells";
        rowNumber.addEventListener("mousedown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          els.gridViewport.focus();
          selectAllVisibleCells();
        });
        els.headerRow.appendChild(rowNumber);

        for (const col of visibleColumns) {
          const cell = document.createElement("div");
          cell.className = "header-cell";
          if (isColumnInSelection(col)) cell.classList.add("selected-column");
          const duplicate = isDuplicateColumn(col);
          if (duplicate) cell.classList.add("duplicate-column");
          cell.style.flex = `0 0 ${state.columnWidths[col] || DEFAULT_COL_WIDTH}px`;
          cell.draggable = false;
          cell.dataset.column = String(col);
          cell.addEventListener("mousedown", (event) =>
            startSelectionDrag("column", state.selected?.rowIndex ?? state.viewIndices[0] ?? 0, col, event),
          );
          cell.addEventListener("mouseenter", () =>
            updateSelectionDrag("column", state.selected?.rowIndex ?? state.viewIndices[0] ?? 0, col),
          );

          const button = document.createElement("button");
          button.className = "header-sort-button";
          button.title = state.headers[col];
          button.dataset.column = String(col);
          button.draggable = true;
          const title = document.createElement("span");
          title.className = "header-title";
          title.textContent = state.headers[col];
          if (duplicate) {
            const dot = document.createElement("span");
            dot.className = "duplicate-column-dot";
            dot.title = "Duplicate column name";
            button.appendChild(dot);
          }
          const sort = document.createElement("span");
          sort.className = "sort-indicator";
          sort.textContent =
            state.sort.column === col ? (state.sort.direction === "asc" ? "▲" : state.sort.direction === "desc" ? "▼" : "") : "";
          button.append(title, sort);
          button.addEventListener("mousedown", (event) => event.stopPropagation());
          button.addEventListener("click", () => selectColumnRange(col, col));
          button.addEventListener("dragstart", (event) => {
            state.dragColumn = col;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", String(col));
          });
          button.addEventListener("dragover", (event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
          });
          button.addEventListener("drop", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const fromColumn =
              state.dragColumn == null ? Number(event.dataTransfer.getData("text/plain")) : state.dragColumn;
            state.dragColumn = null;
            dragColumn(fromColumn, col);
          });
          button.addEventListener("dragend", () => {
            state.dragColumn = null;
          });

          const filterButton = document.createElement("button");
          filterButton.className = `header-filter-button${hasColumnFilter(col) ? " active" : ""}`;
          filterButton.title = "筛选 / 排序";
          filterButton.dataset.column = String(col);
          const filterIcon = document.createElement("span");
          filterIcon.className = "filter-indicator";
          filterIcon.textContent = hasColumnFilter(col) ? "●" : "▾";
          filterButton.appendChild(filterIcon);
          filterButton.addEventListener("mousedown", (event) => event.stopPropagation());
          filterButton.addEventListener("click", (event) => {
            event.stopPropagation();
            openColumnFilterMenu(event.currentTarget, col);
          });

          const handle = document.createElement("span");
          handle.className = "resize-handle";
          handle.dataset.column = String(col);
          handle.addEventListener("mousedown", startResize);
          cell.append(button, filterButton, handle);
          els.headerRow.appendChild(cell);
        }
      }

      function renderGrid() {
        if (state.renderQueued) return;
        state.renderQueued = true;
        requestAnimationFrame(() => {
          state.renderQueued = false;
          renderHeader();
          renderRows();
          els.emptyState.style.display = state.rows.length ? "none" : "grid";
        });
      }

      function renderRows() {
        const scrollTop = els.gridViewport.scrollTop;
        const viewportHeight = els.gridViewport.clientHeight || 1;
        const rowHeight = getCurrentRowHeight();
        const totalRows = state.viewIndices.length;
        const start = Math.max(0, Math.floor(Math.max(0, scrollTop - HEADER_HEIGHT) / rowHeight) - 8);
        const end = Math.min(totalRows, Math.ceil((Math.max(0, scrollTop - HEADER_HEIGHT) + viewportHeight) / rowHeight) + 10);
        const visibleColumns = getVisibleColumnIndexes();
        const totalWidth = getTotalWidth();
        els.gridViewport.classList.toggle("wrap-cells", state.wrapCells);
        els.gridCanvas.style.height = `${HEADER_HEIGHT + totalRows * rowHeight}px`;
        els.gridCanvas.style.width = `${totalWidth}px`;
        els.rowLayer.innerHTML = "";

        for (let virtualIndex = start; virtualIndex < end; virtualIndex += 1) {
          const rowIndex = state.viewIndices[virtualIndex];
          const row = state.rows[rowIndex];
          const hit = state.matchedRows.has(rowIndex);
          const rowEl = document.createElement("div");
          rowEl.className = `data-row${hit ? " hit" : ""}`;
          rowEl.style.top = `${HEADER_HEIGHT + virtualIndex * rowHeight}px`;
          rowEl.style.width = `${totalWidth}px`;
          rowEl.style.height = `${rowHeight}px`;

          const rowNumber = document.createElement("div");
          rowNumber.className = "row-number";
          if (isRowInSelection(rowIndex)) rowNumber.classList.add("selected-row");
          rowNumber.textContent = String(rowIndex + 2);
          rowNumber.addEventListener("mousedown", (event) =>
            startSelectionDrag("row", rowIndex, state.selected?.columnIndex ?? visibleColumns[0] ?? 0, event),
          );
          rowNumber.addEventListener("mouseenter", () =>
            updateSelectionDrag("row", rowIndex, state.selected?.columnIndex ?? visibleColumns[0] ?? 0),
          );
          rowEl.appendChild(rowNumber);

          for (const col of visibleColumns) {
            const value = row[col] || "";
            const summary = summarize(value);
            const meta = getCellMeta(rowIndex, col);
            const cell = document.createElement("div");
            cell.className = `cell${summary.isLong && !state.wrapCells ? " long" : ""}`;
            if (isCellInSelection(rowIndex, col)) {
              cell.classList.add("range-selected");
            }
            if (state.selected && state.selected.rowIndex === rowIndex && state.selected.columnIndex === col) {
              cell.classList.add("selected");
            }
            cell.style.flex = `0 0 ${state.columnWidths[col] || DEFAULT_COL_WIDTH}px`;
            cell.title = state.wrapCells ? value.slice(0, 1000) : summary.isLong ? "文本过长，点击查看全文" : value.slice(0, 1000);
            cell.dataset.row = String(rowIndex);
            cell.dataset.column = String(col);
            renderCellDisplayContent(cell, state.wrapCells ? value : summary.text, els.searchInput.value, meta, {
              allowHtml: !summary.isLong || state.wrapCells,
            });
            cell.addEventListener("mousedown", (event) => {
              if (event.target.closest?.("a")) return;
              startSelectionDrag("cell", rowIndex, col, event);
            });
            cell.addEventListener("mouseenter", () => updateSelectionDrag("cell", rowIndex, col));
            cell.addEventListener("click", () => selectCell(rowIndex, col));
            cell.addEventListener("dblclick", () => openModalForCell(rowIndex, col));
            cell.addEventListener("contextmenu", (event) => openContextMenu(event, rowIndex, col));
            rowEl.appendChild(cell);
          }

          els.rowLayer.appendChild(rowEl);
        }
      }

      function toggleSort(column) {
        if (state.sort.column !== column) {
          state.sort = { column, direction: "asc" };
        } else if (state.sort.direction === "asc") {
          state.sort.direction = "desc";
        } else if (state.sort.direction === "desc") {
          state.sort = { column: -1, direction: "none" };
        } else {
          state.sort = { column, direction: "asc" };
        }
        recomputeView();
      }

      function dragColumn(fromColumn, toColumn) {
        if (!Number.isInteger(fromColumn) || !Number.isInteger(toColumn) || fromColumn === toColumn) return;
        const order = state.columnOrder.length ? [...state.columnOrder] : state.headers.map((_, index) => index);
        const fromIndex = order.indexOf(fromColumn);
        const toIndex = order.indexOf(toColumn);
        if (fromIndex < 0 || toIndex < 0) return;
        order.splice(fromIndex, 1);
        order.splice(toIndex, 0, fromColumn);
        state.columnOrder = order;
        renderColumnPopover();
        renderColumnOverview();
        renderGrid();
      }

      function startResize(event) {
        event.preventDefault();
        event.stopPropagation();
        const column = Number(event.currentTarget.dataset.column);
        state.resize = {
          column,
          startX: event.clientX,
          startWidth: state.columnWidths[column] || DEFAULT_COL_WIDTH,
        };
        document.body.style.cursor = "col-resize";
      }

      function onResizeMove(event) {
        if (!state.resize) return;
        const delta = event.clientX - state.resize.startX;
        state.columnWidths[state.resize.column] = Math.max(
          MIN_COL_WIDTH,
          Math.min(MAX_COL_WIDTH, state.resize.startWidth + delta),
        );
        renderGrid();
      }

      function stopResize() {
        if (!state.resize) return;
        state.resize = null;
        document.body.style.cursor = "";
      }

      function selectCell(rowIndex, columnIndex) {
        setFocusedCell(rowIndex, columnIndex);
        clearSelectionToSelected();
        ensureCellVisible(rowIndex, columnIndex);
        renderGrid();
        renderDetail();
      }

      function getSelectedValue() {
        if (!state.selected) return "";
        return state.rows[state.selected.rowIndex]?.[state.selected.columnIndex] || "";
      }

      function getSelectionText() {
        const endpoints = getSelectionEndpoints();
        if (!endpoints) return getSelectedValue();
        const columns = getVisibleColumnIndexes().slice(endpoints.startColumnPosition, endpoints.endColumnPosition + 1);
        const lines = [];
        for (let rowPosition = endpoints.startRowPosition; rowPosition <= endpoints.endRowPosition; rowPosition += 1) {
          const row = state.rows[state.viewIndices[rowPosition]];
          lines.push(columns.map((columnIndex) => row?.[columnIndex] || "").join("\t"));
        }
        return lines.join("\n");
      }

      function parseClipboardTable(text) {
        const source = String(text ?? "").replace(/(?:\r\n|\r|\n)$/, "");
        if (!source) return [];
        const rows = [];
        let row = [];
        let field = "";
        let inQuotes = false;

        for (let index = 0; index < source.length; index += 1) {
          const ch = source[index];
          if (ch === '"') {
            if (inQuotes && source[index + 1] === '"') {
              field += '"';
              index += 1;
            } else {
              inQuotes = !inQuotes;
            }
            continue;
          }

          if (!inQuotes && ch === "\t") {
            row.push(field);
            field = "";
            continue;
          }

          if (!inQuotes && (ch === "\r" || ch === "\n")) {
            row.push(field);
            rows.push(row);
            row = [];
            field = "";
            if (ch === "\r" && source[index + 1] === "\n") index += 1;
            continue;
          }

          field += ch;
        }

        row.push(field);
        rows.push(row);
        return rows;
      }

      function getPastedColumnCount(rows) {
        let count = 0;
        for (const row of rows) {
          if (row.length > count) count = row.length;
        }
        return count;
      }

      function getFormulaNestingDepth(value) {
        const text = String(value == null ? "" : value);
        let depth = 0;
        for (let index = 0; index < text.length; index += 1) {
          const ch = text[index];
          if (ch === "(" || ch === "[" || ch === "{") depth += 1;
          if (ch === ")" || ch === "]" || ch === "}") depth = Math.max(0, depth - 1);
        }
        return depth;
      }

      function repairFormulaRecord(record, expectedColumns, delimiter) {
        if (!expectedColumns || record.length <= expectedColumns) return record;
        const repaired = [];
        let changed = false;

        for (let index = 0; index < record.length; index += 1) {
          const remainingOutput = expectedColumns - repaired.length;
          const remainingFields = record.length - index;
          if (remainingFields === remainingOutput) {
            repaired.push(...record.slice(index));
            break;
          }

          const startIndex = index;
          let value = record[index];
          if (String(value == null ? "" : value).trimStart().startsWith("=")) {
            let depth = getFormulaNestingDepth(value);
            while (
              depth > 0 &&
              index + 1 < record.length &&
              record.length - (index + 2) >= remainingOutput - 1
            ) {
              index += 1;
              value += delimiter + record[index];
              depth = getFormulaNestingDepth(value);
            }
            if (depth === 0 && index > startIndex) {
              repaired.push(value);
              changed = true;
              continue;
            }
            index = startIndex;
          }

          repaired.push(record[index]);
        }

        return changed && repaired.length === expectedColumns ? repaired : record;
      }

      function buildClipboardHeaders(rawHeaders, columnCount) {
        return Array.from({ length: columnCount }, (_, index) => {
          const value = rawHeaders[index] == null || rawHeaders[index] === "" ? `Column ${index + 1}` : rawHeaders[index];
          return String(value);
        });
      }

      function buildClipboardDataset(text, firstRowAsHeader) {
        const startedAt = Date.now();
        const rows = parseClipboardTable(text).filter((row) =>
          row.some((cell) => String(cell == null ? "" : cell).trim() !== ""),
        );
        const columnCount = getPastedColumnCount(rows);
        if (!rows.length || !columnCount) throw new Error("剪贴板中没有可导入的表格数据");
        const rawHeaders = firstRowAsHeader ? rows[0] : [];
        const sourceRows = firstRowAsHeader ? rows.slice(1) : rows;
        const headers = buildClipboardHeaders(rawHeaders, columnCount);
        const normalizedRows = sourceRows.map((row) =>
          Array.from({ length: columnCount }, (_, index) => (row[index] == null ? "" : String(row[index]))),
        );
        return {
          headers,
          rows: normalizedRows,
          issues: analyzeRows(headers, normalizedRows),
          file: {
            name: "剪贴板表格",
            size: String(text || "").length,
            encoding: "Clipboard",
            delimiter: "Tab",
            parseMs: Date.now() - startedAt,
            kind: "Clipboard",
          },
        };
      }

      async function readClipboardText() {
        if (!navigator.clipboard?.readText) throw new Error("当前浏览器不支持读取剪贴板，请改用文件导入");
        return navigator.clipboard.readText();
      }

      function updateClipboardImportButton() {
        els.clipboardImportButton.disabled = Boolean(state.headers.length || state.rows.length);
        els.clipboardImportButton.title = els.clipboardImportButton.disabled
          ? "已载入数据；如需从剪贴板导入，请刷新页面"
          : "从剪贴板导入表格";
      }

      function openClipboardImportPopover(anchor) {
        if (state.headers.length || state.rows.length) {
          els.leftStatus.textContent = "已载入数据；如需从剪贴板导入，请刷新页面";
          return;
        }
        els.clipboardFirstRowHeaderInput.checked = true;
        const rect = anchor.getBoundingClientRect();
        els.clipboardImportPopover.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 340))}px`;
        els.clipboardImportPopover.style.top = `${Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - 220))}px`;
        els.columnsPopover.classList.remove("open");
        closeAddColumnPopover();
        closeConcatenateColumnPopover();
        closeColumnFilterMenu();
        closeContextMenu();
        els.clipboardImportPopover.classList.add("open");
        els.confirmClipboardImportButton.focus();
      }

      function closeClipboardImportPopover() {
        els.clipboardImportPopover.classList.remove("open");
      }

      async function importClipboardTable() {
        if (state.headers.length || state.rows.length) {
          els.leftStatus.textContent = "已载入数据；如需从剪贴板导入，请刷新页面";
          return;
        }
        const loadToken = beginLoad();
        resetExcelWorkbook();
        try {
          const text = await readClipboardText();
          if (!isCurrentLoad(loadToken)) return;
          const dataset = buildClipboardDataset(text, els.clipboardFirstRowHeaderInput.checked);
          state.sourceFileHandle = null;
          setDataset(dataset);
          els.fileHint.textContent = dataset.file.name;
          els.fileHint.title = "从剪贴板导入的表格";
          closeClipboardImportPopover();
          els.leftStatus.textContent = `已从剪贴板导入 ${dataset.rows.length.toLocaleString()} 行 × ${dataset.headers.length.toLocaleString()} 列`;
        } catch (error) {
          if (!isCurrentLoad(loadToken)) return;
          els.leftStatus.textContent = `剪贴板导入失败：${error.message}`;
        }
      }

      function pasteClipboardTextIntoSelection(text) {
        const pastedRows = parseClipboardTable(text);
        const pastedColumnCount = getPastedColumnCount(pastedRows);
        if (!pastedRows.length || !pastedColumnCount) return false;
        if (!state.selected) {
          els.leftStatus.textContent = "请先选中一个自定义列单元格再粘贴";
          return true;
        }

        const visibleColumns = getVisibleColumnIndexes();
        const startRowPosition = getVisibleRowPosition(state.selected.rowIndex);
        const startColumnPosition = visibleColumns.indexOf(state.selected.columnIndex);
        if (startRowPosition < 0 || startColumnPosition < 0) {
          els.leftStatus.textContent = "当前选区不可粘贴";
          return true;
        }

        const targetColumns = visibleColumns.slice(startColumnPosition, startColumnPosition + pastedColumnCount);
        if (targetColumns.length < pastedColumnCount) {
          els.leftStatus.textContent = "粘贴区域超出可见列，请先新增或显示足够的自定义列";
          return true;
        }

        if (!targetColumns.every((columnIndex) => isCustomColumn(columnIndex))) {
          els.leftStatus.textContent = "只能向自定义列粘贴，原始导入列不可修改";
          return true;
        }

        const writableRowCount = Math.min(pastedRows.length, state.viewIndices.length - startRowPosition);
        if (writableRowCount <= 0) {
          els.leftStatus.textContent = "粘贴区域超出当前可见行";
          return true;
        }

        const anchor = { ...state.selected };
        const touchedColumns = new Set(targetColumns);
        const touchedRows = new Set();
        for (let rowOffset = 0; rowOffset < writableRowCount; rowOffset += 1) {
          const rowIndex = state.viewIndices[startRowPosition + rowOffset];
          touchedRows.add(rowIndex);
          const row = state.rows[rowIndex];
          for (let columnOffset = 0; columnOffset < pastedColumnCount; columnOffset += 1) {
            const columnIndex = targetColumns[columnOffset];
            row[columnIndex] = pastedRows[rowOffset]?.[columnOffset] ?? "";
            if (state.cellMeta?.size) state.cellMeta.delete(`${rowIndex}:${columnIndex}`);
          }
        }

        for (const columnIndex of touchedColumns) invalidateColumnValueCache(columnIndex);
        refreshIssuesAfterCellEdits(touchedRows);
        const endRowIndex = state.viewIndices[startRowPosition + writableRowCount - 1];
        const endColumnIndex = targetColumns[targetColumns.length - 1];
        selectCellRange(anchor.rowIndex, anchor.columnIndex, endRowIndex, endColumnIndex, { silent: true });
        recomputeView();
        updateFileStats();
        renderDetail();
        if (targetColumns.includes(state.columnFilterMenu.columnIndex)) renderColumnFilterValues();

        const truncatedRows = pastedRows.length - writableRowCount;
        const baseStatus = `已粘贴 ${writableRowCount.toLocaleString()} 行 × ${pastedColumnCount.toLocaleString()} 列`;
        els.leftStatus.textContent = truncatedRows > 0
          ? `${baseStatus}，超出 ${truncatedRows.toLocaleString()} 行未写入`
          : baseStatus;
        return true;
      }

      function getLineCount(text) {
        if (!text) return 0;
        return String(text).split(/\r\n|\r|\n/).length;
      }

      function countOccurrences(text, query, caseSensitive) {
        if (!query) return 0;
        const haystack = normalizeForSearch(text, caseSensitive);
        const needle = normalizeForSearch(query, caseSensitive);
        if (!needle) return 0;
        let count = 0;
        let offset = 0;
        let found = haystack.indexOf(needle, offset);
        while (found >= 0) {
          count += 1;
          offset = found + needle.length;
          found = haystack.indexOf(needle, offset);
          if (count > 100000) break;
        }
        return count;
      }

      function renderTextContent(container, value, query, limit, meta = null) {
        const text = value == null ? "" : String(value);
        const shown = text.slice(0, limit);
        renderCellDisplayContent(container, shown, query, meta, {
          allowHtml: Boolean(meta?.html) && shown.length === text.length,
        });
        if (shown.length < text.length) {
          const tail = document.createElement("div");
          tail.style.marginTop = "12px";
          tail.style.color = "var(--muted)";
          tail.textContent = `已显示 ${shown.length.toLocaleString()} / ${text.length.toLocaleString()} 字符`;
          container.appendChild(tail);
        }
      }

      function renderDetail() {
        const selected = state.selected;
        const value = getSelectedValue();
        const hasSelection = Boolean(selected);
        els.copyCellButton.disabled = !hasSelection;
        els.openModalButton.disabled = !hasSelection;
        els.loadMoreDetailButton.disabled = !hasSelection || value.length <= state.detailVisibleChars;
        els.detailContent.classList.toggle("mono", els.monoInput.checked);

        if (!selected) {
          els.detailMeta.innerHTML = "";
          applyCellMetaStyle(els.detailContent, null);
          els.detailContent.textContent = "";
          els.detailStatus.textContent = "未选择单元格";
          return;
        }

        const cellMeta = getCellMeta(selected.rowIndex, selected.columnIndex);
        els.detailMeta.innerHTML = "";
        const metaItems = [
          `行 ${selected.rowIndex + 2}`,
          `列 ${selected.columnIndex + 1}`,
          state.headers[selected.columnIndex] || "",
          `${String(value).length.toLocaleString()} 字符`,
          `${getLineCount(value).toLocaleString()} 行文本`,
        ];
        for (const item of metaItems) {
          const pill = document.createElement("span");
          pill.className = "pill";
          pill.textContent = item;
          els.detailMeta.appendChild(pill);
        }

        const occurrences = countOccurrences(value, els.detailSearchInput.value, els.caseSensitiveInput.checked);
        renderTextContent(els.detailContent, value, els.detailSearchInput.value, state.detailVisibleChars, cellMeta);
        els.detailStatus.textContent = `${Math.min(value.length, state.detailVisibleChars).toLocaleString()} / ${value.length.toLocaleString()} 字符 · 命中 ${occurrences.toLocaleString()}`;
        els.leftStatus.textContent = `选中 R${selected.rowIndex + 2}C${selected.columnIndex + 1}`;
      }

      function renderModal() {
        const cell = state.modalCell;
        if (!cell) return;
        const value = state.rows[cell.rowIndex]?.[cell.columnIndex] || "";
        const cellMeta = getCellMeta(cell.rowIndex, cell.columnIndex);
        els.modalContent.classList.toggle("mono", els.modalMonoInput.checked);
        els.modalTitle.textContent = `R${cell.rowIndex + 2}C${cell.columnIndex + 1} · ${state.headers[cell.columnIndex] || ""}`;
        renderTextContent(els.modalContent, value, els.modalSearchInput.value, state.modalVisibleChars, cellMeta);
        const occurrences = countOccurrences(value, els.modalSearchInput.value, els.caseSensitiveInput.checked);
        els.modalStatus.textContent = `${Math.min(value.length, state.modalVisibleChars).toLocaleString()} / ${value.length.toLocaleString()} 字符 · 命中 ${occurrences.toLocaleString()}`;
        els.loadMoreModalButton.disabled = value.length <= state.modalVisibleChars;
      }

      function openModalForCell(rowIndex, columnIndex) {
        state.modalCell = { rowIndex, columnIndex };
        state.modalVisibleChars = MODAL_CHUNK;
        els.modalSearchInput.value = els.detailSearchInput.value;
        els.modalBackdrop.classList.add("open");
        renderModal();
      }

      function closeModal() {
        els.modalBackdrop.classList.remove("open");
        state.modalCell = null;
      }

      function openContextMenu(event, rowIndex, columnIndex) {
        event.preventDefault();
        selectCell(rowIndex, columnIndex);
        els.contextMenu.style.left = `${Math.min(event.clientX, window.innerWidth - 190)}px`;
        els.contextMenu.style.top = `${Math.min(event.clientY, window.innerHeight - 150)}px`;
        els.contextMenu.classList.add("open");
      }

      function closeContextMenu() {
        els.contextMenu.classList.remove("open");
      }

      function handleDocumentPointerDown(event) {
        if (!eventPathContains(event, els.contextMenu)) closeContextMenu();
      }

      function eventPathContains(event, element) {
        if (!element) return false;
        const path = typeof event.composedPath === "function" ? event.composedPath() : [];
        return path.length ? path.includes(element) : element.contains(event.target);
      }

      function eventPathHasSelector(event, selector) {
        const path = typeof event.composedPath === "function" ? event.composedPath() : [];
        if (path.length) {
          return path.some((node) => node instanceof Element && node.matches(selector));
        }
        return event.target instanceof Element ? Boolean(event.target.closest(selector)) : false;
      }

      function closeColumnFilterMenu() {
        els.columnFilterPopover.classList.remove("open");
        state.columnFilterMenu = { columnIndex: -1, query: "" };
      }

      function openColumnFilterMenu(anchor, columnIndex) {
        state.columnFilterMenu = { columnIndex, query: "" };
        els.columnFilterTitle.textContent = `${columnIndex + 1}. ${state.headers[columnIndex] || ""}`;
        els.columnFilterSearchInput.value = "";
        els.renameColumnInput.value = state.headers[columnIndex] || "";
        els.restoreColumnNameButton.disabled = state.headers[columnIndex] === state.originalHeaders[columnIndex];
        els.deleteCustomColumnButton.disabled = !isCustomColumn(columnIndex);
        els.deleteCustomColumnButton.title = isCustomColumn(columnIndex) ? "删除此自定义列" : "原始导入列不能删除";
        const rect = anchor.getBoundingClientRect();
        els.columnFilterPopover.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 350))}px`;
        els.columnFilterPopover.style.top = `${Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - 420))}px`;
        closeAddColumnPopover();
        closeConcatenateColumnPopover();
        els.columnsPopover.classList.remove("open");
        els.columnFilterPopover.classList.add("open");
        renderColumnFilterValues();
        els.columnFilterSearchInput.focus();
      }

      function getMenuFilteredValues(allValues = null) {
        const columnIndex = state.columnFilterMenu.columnIndex;
        if (columnIndex < 0) return [];
        const query = state.columnFilterMenu.query;
        const values = allValues || getColumnUniqueValues(columnIndex);
        if (!query) return values;
        const needle = normalizeForSearch(query, els.caseSensitiveInput.checked);
        return values.filter((item) => normalizeForSearch(item.value, els.caseSensitiveInput.checked).includes(needle));
      }

      function renderColumnFilterValues() {
        const columnIndex = state.columnFilterMenu.columnIndex;
        els.columnFilterValues.innerHTML = "";
        if (columnIndex < 0) {
          els.columnFilterSummary.textContent = "未选择列";
          return;
        }

        const allValues = getColumnUniqueValues(columnIndex);
        const visibleValues = getMenuFilteredValues(allValues);
        const shownValues = visibleValues.slice(0, 500);
        const selectedCount = getColumnFilterSelectedCount(columnIndex, allValues);
        els.columnFilterSummary.textContent = `已选择 ${selectedCount} / ${allValues.length} 个值，当前显示 ${shownValues.length} 个`;

        if (!shownValues.length) {
          const empty = document.createElement("div");
          empty.className = "filter-summary";
          empty.style.padding = "10px";
          empty.textContent = "没有匹配的值";
          els.columnFilterValues.appendChild(empty);
          return;
        }

        for (const item of shownValues) {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = isColumnFilterValueSelected(columnIndex, item.value);
          checkbox.addEventListener("change", () => {
            updateColumnFilterValue(columnIndex, item.value, checkbox.checked, allValues);
            recomputeView();
            renderColumnFilterValues();
          });

          const valueText = document.createElement("span");
          valueText.className = "filter-value-text";
          valueText.title = item.value;
          valueText.textContent = item.value === "" ? "(空白)" : item.value;

          const count = document.createElement("span");
          count.className = "filter-value-count";
          count.textContent = String(item.count);

          label.append(checkbox, valueText, count);
          els.columnFilterValues.appendChild(label);
        }
      }

      function updateFilterValuesForVisible(checked) {
        const columnIndex = state.columnFilterMenu.columnIndex;
        if (columnIndex < 0) return;
        const allValues = getColumnUniqueValues(columnIndex);
        updateColumnFilterValues(columnIndex, getMenuFilteredValues(allValues), checked, allValues);
        recomputeView();
        renderColumnFilterValues();
      }

      function clearCurrentColumnFilter() {
        const columnIndex = state.columnFilterMenu.columnIndex;
        if (columnIndex < 0) return;
        clearColumnFilter(columnIndex);
        recomputeView();
        renderColumnFilterValues();
      }

      function hideRowsByCurrentColumnFilter() {
        const rowsToHide = [...state.viewIndices];
        for (const rowIndex of rowsToHide) {
          state.hiddenRows.add(rowIndex);
        }
        closeColumnFilterMenu();
        recomputeView();
      }

      function showHiddenRows() {
        state.hiddenRows = new Set();
        recomputeView();
        renderColumnFilterValues();
      }

      function clearAllFilters() {
        clearAllColumnFilters();
        state.hiddenRows = new Set();
        state.sort = { column: -1, direction: "none" };
        els.searchInput.value = "";
        els.searchColumnSelect.value = "-1";
        els.matchedOnlyInput.checked = false;
        closeColumnFilterMenu();
        recomputeView();
        renderDetail();
      }

      function updateSearchColumns() {
        const selectedValue = els.searchColumnSelect.value;
        els.searchColumnSelect.innerHTML = '<option value="-1">全部列</option>';
        state.headers.forEach((header, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${index + 1}. ${header}`;
          els.searchColumnSelect.appendChild(option);
        });
        const selectedIndex = Number(selectedValue);
        els.searchColumnSelect.value =
          selectedValue === "-1" || (Number.isInteger(selectedIndex) && selectedIndex >= 0 && selectedIndex < state.headers.length)
            ? selectedValue
            : "-1";
      }

      function renderColumnPopover() {
        els.columnList.innerHTML = "";
        state.headers.forEach((header, index) => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = state.visibleColumns[index];
          checkbox.addEventListener("change", () => {
            state.visibleColumns[index] = checkbox.checked;
            renderGrid();
          });
          const text = document.createElement("span");
          text.textContent = `${index + 1}. ${header}`;
          label.append(checkbox, text);
          els.columnList.appendChild(label);
        });
      }

      function renderColumnOverview() {
        els.columnOverview.innerHTML = "";
        if (!state.headers.length) {
          const empty = document.createElement("span");
          empty.className = "pill";
          empty.textContent = "未加载列";
          els.columnOverview.appendChild(empty);
          return;
        }

        state.headers.forEach((header, index) => {
          const pill = document.createElement("span");
          pill.className = `pill${hasColumnFilter(index) ? " warning" : ""}`;
          pill.title = header;
          pill.textContent = `${index + 1}. ${header}`;
          els.columnOverview.appendChild(pill);
        });
      }

      function getNextColumnName() {
        const used = new Set(state.headers);
        let index = state.headers.length + 1;
        let name = `新列 ${index}`;
        while (used.has(name)) {
          index += 1;
          name = `新列 ${index}`;
        }
        return name;
      }

      function getColumnOptionLabel(index) {
        const name = state.headers[index] || `Column ${index + 1}`;
        return `${index + 1}. ${name}`;
      }

      function normalizeConcatenateScheme(raw) {
        if (!raw || typeof raw !== "object") return null;
        const items = Array.isArray(raw.items)
          ? raw.items
              .map((item) => ({
                sourceName: String(item.sourceName || "").trim(),
                alias: String(item.alias || "").trim(),
              }))
              .filter((item) => item.sourceName)
          : [];
        if (!items.length) return null;
        const outputName = String(raw.outputName || raw.name || "").trim() || "用户问题";
        const scheme = {
          name: String(raw.name || outputName).trim() || outputName,
          outputName,
          items,
          updatedAt: Number(raw.updatedAt) || Date.now(),
        };
        scheme.signature = getConcatenateSchemeSignature(scheme);
        return scheme;
      }

      function getConcatenateSchemeSignature(scheme) {
        return JSON.stringify({
          outputName: String(scheme.outputName || "").trim(),
          items: (scheme.items || []).map((item) => ({
            sourceName: String(item.sourceName || "").trim(),
            alias: String(item.alias || "").trim(),
          })),
        });
      }

      function getConcatenateSchemeLabel(scheme) {
        const sources = (scheme.items || []).map((item) => item.sourceName).filter(Boolean).join(" + ");
        return `${scheme.outputName || scheme.name || "用户问题"} · ${sources || "未命名方案"}`;
      }

      function loadConcatenateSchemes() {
        try {
          const parsed = JSON.parse(localStorage.getItem(CONCATENATE_SCHEMES_STORAGE_KEY) || "[]");
          if (!Array.isArray(parsed)) return [];
          return parsed
            .map(normalizeConcatenateScheme)
            .filter(Boolean)
            .slice(0, MAX_CONCATENATE_SCHEMES);
        } catch (error) {
          return [];
        }
      }

      function persistConcatenateSchemes(schemes) {
        try {
          localStorage.setItem(CONCATENATE_SCHEMES_STORAGE_KEY, JSON.stringify(schemes.slice(0, MAX_CONCATENATE_SCHEMES)));
        } catch (error) {
          // localStorage can be unavailable in private or restricted contexts.
        }
      }

      function buildConcatenateSchemeFromSelection({ name, items }) {
        const outputName = String(name || "").trim() || "用户问题";
        const scheme = {
          name: outputName,
          outputName,
          items: items.map((item) => ({
            sourceName: state.headers[item.columnIndex] || `Column ${item.columnIndex + 1}`,
            alias: String(item.alias || "").trim() || state.headers[item.columnIndex] || `Column ${item.columnIndex + 1}`,
          })),
          updatedAt: Date.now(),
        };
        scheme.signature = getConcatenateSchemeSignature(scheme);
        return scheme;
      }

      function saveConcatenateScheme({ name, items }) {
        if (!items?.length) return;
        const scheme = buildConcatenateSchemeFromSelection({ name, items });
        const schemes = [scheme, ...loadConcatenateSchemes().filter((item) => item.signature !== scheme.signature)]
          .slice(0, MAX_CONCATENATE_SCHEMES);
        state.concatenateSchemes = schemes;
        persistConcatenateSchemes(schemes);
        if (els.concatenateColumnPopover.classList.contains("open")) renderConcatenateSchemeOptions();
      }

      function renderConcatenateSchemeOptions() {
        els.concatenateSchemeSelect.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = state.concatenateSchemes.length ? "选择已保存方案" : "暂无可复用方案";
        els.concatenateSchemeSelect.appendChild(placeholder);
        state.concatenateSchemes.forEach((scheme) => {
          const option = document.createElement("option");
          option.value = scheme.signature;
          option.textContent = getConcatenateSchemeLabel(scheme);
          els.concatenateSchemeSelect.appendChild(option);
        });
        els.concatenateSchemeSelect.disabled = !state.concatenateSchemes.length;
        els.applyConcatenateSchemeButton.disabled = !state.concatenateSchemes.length;
      }

      function applyConcatenateScheme() {
        const signature = els.concatenateSchemeSelect.value;
        const scheme = state.concatenateSchemes.find((item) => item.signature === signature);
        if (!scheme) return;
        els.concatenateColumnNameInput.value = scheme.outputName || scheme.name || "用户问题";
        state.concatenateColumnItems = scheme.items.map((item) => {
          const sourceName = String(item.sourceName || "").trim();
          const matches = state.headers
            .map((header, headerIndex) => ({ header, headerIndex }))
            .filter(({ header }) => header === sourceName);
          return {
            columnIndex: matches[0]?.headerIndex ?? 0,
            manualName: matches.length === 1 ? "" : sourceName,
            alias: String(item.alias || "").trim() || sourceName,
          };
        });
        if (!state.concatenateColumnItems.length) state.concatenateColumnItems = [createDefaultConcatenateItem(0)];
        renderConcatenateRows();
        const resolved = resolveConcatenateItems(state.concatenateColumnItems);
        setConcatenateValidation(resolved.errors);
      }

      function createDefaultConcatenateItem(columnIndex = 0) {
        const index = Math.max(0, Math.min(Number(columnIndex) || 0, Math.max(0, state.headers.length - 1)));
        return {
          columnIndex: index,
          manualName: "",
          alias: state.headers[index] || `Column ${index + 1}`,
        };
      }

      function setConcatenateValidation(errors = []) {
        els.concatenateValidationStatus.textContent = errors.join("\n");
      }

      function buildConcatenatedValue(items, row) {
        const markdownFence = "```markdown";
        const closingFence = "```";
        return items
          .map((item) => {
            const alias = item.alias || state.headers[item.columnIndex] || `Column ${item.columnIndex + 1}`;
            const value = row[item.columnIndex] == null ? "" : String(row[item.columnIndex]);
            return `# ${alias}\n${markdownFence}\n${value}\n${closingFence}`;
          })
          .join("\n\n");
      }

      function resolveConcatenateItems(items) {
        const errors = [];
        const resolved = [];
        items.forEach((item, index) => {
          const rowNumber = index + 1;
          const manualName = String(item.manualName || "").trim();
          let columnIndex = Number(item.columnIndex);
          if (manualName) {
            const matches = state.headers
              .map((header, headerIndex) => ({ header, headerIndex }))
              .filter(({ header }) => header === manualName);
            if (!matches.length) {
              errors.push(`第 ${rowNumber} 行：未找到列名「${manualName}」`);
              return;
            }
            if (matches.length > 1) {
              errors.push(`第 ${rowNumber} 行：列名「${manualName}」重复，请用下拉框精确选择`);
              return;
            }
            columnIndex = matches[0].headerIndex;
          }
          if (!Number.isInteger(columnIndex) || columnIndex < 0 || columnIndex >= state.headers.length) {
            errors.push(`第 ${rowNumber} 行：请选择有效列`);
            return;
          }
          resolved.push({
            columnIndex,

          });
        });
        if (!resolved.length && !errors.length) errors.push("请至少添加一个拼接项");
        return { items: resolved, errors };
