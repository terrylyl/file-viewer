<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地表格文件查看器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f7;
        --panel: #ffffff;
        --panel-2: #f8fafb;
        --line: #d7dee3;
        --line-strong: #aebbc4;
        --text: #192026;
        --muted: #687783;
        --accent: #0f766e;
        --accent-2: #b45309;
        --danger: #b42318;
        --ok: #067647;
        --mark: #ffe08a;
        --row: #ffffff;
        --row-alt: #f9fbfc;
        --row-hit: #fff8df;
        --selected: #d7f2ec;
        --shadow: 0 18px 40px rgba(25, 32, 38, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font-family:
          ui-sans-serif,
          "Segoe UI",
          "Microsoft YaHei",
          "PingFang SC",
          sans-serif;
        font-size: 13px;
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--line-strong);
        background: #f2f6f7;
      }

      button.primary {
        border-color: #0f766e;
        background: #0f766e;
        color: #ffffff;
      }

      button.ghost {
        border-color: transparent;
        background: transparent;
      }

      button.danger {
        border-color: #f1b8b3;
        color: var(--danger);
      }

      button.danger:hover {
        border-color: #d92d20;
        background: #fff1f1;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      input,
      select {
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 9px;
        color: var(--text);
        background: var(--panel);
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.12);
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        white-space: nowrap;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr 28px;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: grid;
        grid-template-columns: minmax(260px, 360px) 1fr;
        gap: 12px;
        padding: 10px 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1 1 auto;
        min-width: 0;
      }

      .file-title-block {
        min-width: 0;
        flex: 1 1 auto;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        border: 1px solid #24423d;
        background:
          linear-gradient(90deg, transparent 31%, rgba(255, 255, 255, 0.5) 32%, transparent 33%),
          linear-gradient(0deg, transparent 31%, rgba(255, 255, 255, 0.5) 32%, transparent 33%),
          #0f766e;
        background-size: 10px 10px;
        flex: 0 0 auto;
      }

      .brand h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
        font-weight: 700;
      }

      .brand p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-name-text {
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .drop-zone {
        min-height: 68px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        background: var(--panel-2);
        min-width: 0;
      }

      #chooseFileButton {
        flex: 0 0 auto;
        min-width: 104px;
        white-space: nowrap;
      }

      .file-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .drop-zone.dragover {
        border-color: var(--accent);
        background: #e8f7f3;
      }

      .drop-zone strong {
        display: block;
        font-size: 13px;
        margin-bottom: 3px;
      }

      .drop-zone span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        min-width: 0;
        display: grid;
        grid-template-rows: auto auto;
        gap: 8px;
      }

      .toolbar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .toolbar-row.metrics-row {
        align-items: flex-start;
      }

      .search-input {
        width: min(360px, 35vw);
      }

      .sheet-control select {
        max-width: 180px;
      }

      .export-split-input {
        width: 74px;
      }

      .file-stats {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .column-overview-row {
        width: 100%;
        min-width: 0;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }

      .column-overview {
        width: 100%;
        max-height: 68px;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        flex-wrap: wrap;
        padding: 0 0 2px;
      }

      .column-overview .pill {
        max-width: 220px;
        background: #eef7f5;
        border-color: #c8ded9;
        color: #31524c;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 24px;
        max-width: 260px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pill.warning {
        color: var(--accent-2);
        border-color: #f3ca8d;
        background: #fff7ed;
      }

      .main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 0;
      }

      .main.detail-collapsed {
        grid-template-columns: minmax(0, 1fr) 42px;
      }

      .table-region {
        min-width: 0;
        min-height: 0;
        position: relative;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      .grid-viewport {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: var(--panel);
      }

      .grid-canvas {
        position: relative;
      }

      .header-row,
      .data-row {
        display: flex;
        position: absolute;
        left: 0;
      }

      .header-row {
        top: 0;
        height: 38px;
        z-index: 5;
        position: sticky;
        background: #eef3f5;
        border-bottom: 1px solid var(--line-strong);
      }

      .data-row {
        height: 34px;
      }

      .data-row:nth-child(even) .cell {
        background: var(--row-alt);
      }

      .data-row.hit .cell {
        background: var(--row-hit);
      }

      .cell,
      .header-cell,
      .row-number {
        height: 100%;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .header-cell {
        position: relative;
        background: #eef3f5;
        font-weight: 650;
        color: #28343b;
        user-select: none;
      }

      .header-cell.duplicate-column {
        background: #fff1f1;
        box-shadow: inset 0 -2px 0 var(--danger);
      }

      .header-cell.selected-column,
      .row-number.selected-row {
        background: #d7f2ec;
        color: #0c514b;
      }

      .row-number.select-all-corner {
        justify-content: center;
        cursor: pointer;
      }

      .header-sort-button {
        border: 0;
        background: transparent;
        flex: 1 1 auto;
        height: 100%;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 8px;
        min-width: 0;
        cursor: grab;
      }

      .header-sort-button:active {
        cursor: grabbing;
      }

      .header-filter-button {
        flex: 0 0 30px;
        width: 30px;
        height: 100%;
        border: 0;
        border-left: 1px solid transparent;
        border-radius: 0;
        padding: 0;
        background: transparent;
        color: var(--muted);
      }

      .header-filter-button:hover,
      .header-filter-button.active {
        border-left-color: var(--line);
        background: #dfe8eb;
        color: var(--accent);
      }

      .header-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .duplicate-column-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 2px #ffffff;
        flex: 0 0 auto;
      }

      .sort-indicator {
        color: var(--accent);
        width: 14px;
        text-align: center;
        flex: 0 0 auto;
      }

      .filter-indicator {
        display: inline-flex;
        width: 16px;
        height: 16px;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        line-height: 1;
      }

      .resize-handle {
        position: absolute;
        top: 0;
        right: -3px;
        width: 7px;
        height: 100%;
        cursor: col-resize;
        z-index: 3;
      }

      .resize-handle:hover {
        background: rgba(15, 118, 110, 0.18);
      }

      .row-number {
        justify-content: flex-end;
        padding: 0 8px;
        color: var(--muted);
        background: #f2f5f6;
        font-variant-numeric: tabular-nums;
        position: sticky;
        left: 0;
        z-index: 2;
        flex: 0 0 64px;
      }

      .header-row .row-number {
        z-index: 7;
        font-weight: 650;
        color: #40505a;
      }

      .cell {
        padding: 0 8px;
        background: var(--row);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: default;
      }

      .cell.selected {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        background: var(--selected) !important;
      }

      .cell.range-selected {
        background: #e6f7f2 !important;
      }

      .cell.long {
        color: #665000;
      }

      .grid-viewport.wrap-cells .cell {
        align-items: flex-start;
        padding-top: 6px;
        padding-bottom: 6px;
        white-space: pre-wrap;
        overflow: auto;
        overflow-wrap: anywhere;
        text-overflow: clip;
        line-height: 1.45;
      }

      .cell a,
      .detail-content a {
        color: #075985;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      mark {
        background: var(--mark);
        color: inherit;
        padding: 0 1px;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
        padding: 24px;
        pointer-events: none;
      }

      .empty-state strong {
        color: var(--text);
        display: block;
        margin-bottom: 8px;
        font-size: 15px;
      }

      .detail-panel {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        background: #fbfcfd;
      }

      .detail-panel.collapsed {
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      .detail-panel.collapsed > :not(.detail-collapsed-button) {
        display: none;
      }

      .detail-collapsed-button {
        width: 100%;
        height: 100%;
        writing-mode: vertical-rl;
        border: 0;
        border-radius: 0;
        background: #eef3f5;
        color: var(--muted);
      }

      .detail-head {
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .detail-head strong {
        font-size: 14px;
      }

      .detail-meta {
        padding: 9px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        border-bottom: 1px solid var(--line);
      }

      .detail-tools {
        padding: 8px 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
      }

      .detail-search {
        flex: 1 1 140px;
        min-width: 0;
      }

      .detail-content {
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
        background: #ffffff;
      }

      .detail-content.mono {
        font-family:
          ui-monospace,
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }

      .detail-foot {
        border-top: 1px solid var(--line);
        padding: 8px 12px;
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
      }

      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px solid var(--line);
        background: #eef3f5;
        color: var(--muted);
        padding: 0 10px;
        min-width: 0;
        font-size: 12px;
      }

      .statusbar span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .progress-shell {
        width: min(280px, 28vw);
        height: 7px;
        border-radius: 999px;
        background: #dce4e8;
        overflow: hidden;
      }

      .progress {
        width: 0%;
        height: 100%;
        background: var(--accent);
        transition: width 120ms linear;
      }

      .popover,
      .context-menu {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        box-shadow: var(--shadow);
        z-index: 30;
      }

      .popover {
        width: 300px;
        max-height: min(520px, 70vh);
        padding: 10px;
        display: none;
      }

      .popover.open {
        display: block;
      }

      .column-list {
        max-height: 390px;
        overflow: auto;
        display: grid;
        gap: 5px;
        margin-top: 8px;
      }

      .column-list label {
        justify-content: flex-start;
        color: var(--text);
      }

      .filter-popover {
        width: 340px;
        padding: 10px;
      }

      .add-column-popover {
        width: 320px;
      }

      .clipboard-import-popover {
        width: 320px;
        padding: 10px;
      }

      .concatenate-popover {
        width: min(760px, calc(100vw - 28px));
      }

      .form-stack {
        display: grid;
        gap: 9px;
      }

      .form-stack label {
        display: grid;
        gap: 5px;
        color: var(--text);
        white-space: normal;
      }

      .form-stack input,
      .form-stack select {
        width: 100%;
      }

      .popover-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
      }

      .concatenate-head {
        display: grid;
        grid-template-columns: minmax(180px, 280px) 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      .concatenate-scheme-row {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 8px;
        margin-bottom: 10px;
        align-items: end;
      }

      .concatenate-scheme-row label {
        display: grid;
        gap: 5px;
        color: var(--text);
        white-space: normal;
      }

      .concatenate-scheme-row select {
        width: 100%;
      }

      .concatenate-rows {
        display: grid;
        gap: 7px;
        max-height: 300px;
        overflow: auto;
        padding: 2px 1px;
      }

      .concatenate-row {
        display: grid;
        grid-template-columns: 28px minmax(160px, 1.1fr) minmax(150px, 1fr) minmax(150px, 1fr) 32px;
        gap: 7px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px;
        background: var(--panel-2);
      }

      .drag-handle,
      .icon-button {
        width: 30px;
        padding: 0;
      }

      .drag-handle {
        cursor: grab;
        color: var(--muted);
        background: #edf3f4;
      }

      .concatenate-row select,
      .concatenate-row input {
        width: 100%;
      }

      .validation-status {
        min-height: 20px;
        color: var(--danger);
        font-size: 12px;
        margin-top: 8px;
        white-space: pre-wrap;
      }

      .filter-rename {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        margin: 8px 0;
      }

      .filter-rename input {
        min-width: 0;
      }

      .filter-title {
        font-weight: 650;
        margin-bottom: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .filter-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }

      .filter-actions button {
        width: 100%;
      }

      .filter-search-row {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }

      .filter-search-row input {
        flex: 1 1 auto;
        min-width: 0;
      }

      .filter-summary {
        color: var(--muted);
        font-size: 12px;
        margin: 6px 0;
      }

      .filter-values {
        max-height: 260px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
      }

      .filter-values label {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        padding: 6px 8px;
        color: var(--text);
        white-space: normal;
      }

      .filter-values label + label {
        border-top: 1px solid var(--line);
      }

      .filter-value-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .filter-value-count {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .context-menu {
        display: none;
        min-width: 180px;
        padding: 6px;
      }

      .context-menu.open {
        display: grid;
      }

      .context-menu button {
        border: 0;
        border-radius: 5px;
        justify-content: flex-start;
        text-align: left;
        width: 100%;
        background: transparent;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(14, 21, 26, 0.42);
        z-index: 50;
        padding: 22px;
      }

      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(1100px, 96vw);
        height: min(780px, 92vh);
        background: var(--panel);
        border-radius: 8px;
        box-shadow: var(--shadow);
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        overflow: hidden;
      }

      .modal-head,
      .modal-tools,
      .modal-foot {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .modal-foot {
        border-top: 1px solid var(--line);
        border-bottom: 0;
        color: var(--muted);
      }

      .modal-content {
        padding: 14px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
      }

      .modal-content.mono {
        font-family:
          ui-monospace,
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }

      .issue-button {
        color: var(--accent-2);
      }

      @media (max-width: 980px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) 320px;
        }

        .main.detail-collapsed {
          grid-template-rows: minmax(0, 1fr) 38px;
          grid-template-columns: 1fr;
        }

        .table-region {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .search-input {
          width: min(100%, 420px);
        }

        .concatenate-head,
        .concatenate-row,
        .filter-rename {
          grid-template-columns: 1fr;
        }

        .drag-handle,
        .icon-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="drop-zone" id="dropZone">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true"></div>
            <div class="file-title-block">
              <h1>本地表格文件查看器</h1>
              <p class="file-name-text" id="fileHint" title="CSV 离线处理，Excel 使用可选 SheetJS 读取">CSV 离线处理，Excel 使用可选 SheetJS 读取</p>
            </div>
          </div>
          <div class="file-actions">
            <input id="fileInput" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden />
            <button id="clipboardImportButton">导入剪贴板表格</button>
            <button class="primary" id="chooseFileButton">选择文件</button>
          </div>
        </div>

    <script id="csv-worker-source" type="text/plain">
const DEFAULT_PREVIEW_LIMIT = 500;
const DEFAULT_LONG_FIELD_THRESHOLD = 50000;
const EMPTY_RATIO_THRESHOLD = 0.6;

function normalizeNewline(ch, text, index) {
  if (ch === "\r") {
    return { isNewline: true, nextIndex: text[index + 1] === "\n" ? index + 1 : index };
  }
  return { isNewline: ch === "\n", nextIndex: index };
}

function getSampleRecords(text, limit = 20) {
  const records = [];
  let field = "";
  let record = [];
  let inQuotes = false;
  let started = false;

  for (let i = 0; i < text.length && records.length < limit; i += 1) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') {
        field += '"';
        i += 1;
      } else {
        inQuotes = !inQuotes;
      }
      started = true;
      continue;
    }

    const newline = normalizeNewline(ch, text, i);
    if (!inQuotes && newline.isNewline) {
      record.push(field);
      records.push(record);
      field = "";
      record = [];
      started = false;
      i = newline.nextIndex;
      continue;
    }

    field += ch;
    started = true;
  }

  if (records.length < limit && (started || field.length > 0 || record.length > 0)) {
    record.push(field);
    records.push(record);
  }
  return records;
}

function countDelimiterOutsideQuotes(recordText, delimiter) {
  let count = 0;
  let inQuotes = false;
  for (let i = 0; i < recordText.length; i += 1) {
    const ch = recordText[i];
    if (ch === '"') {
      if (inQuotes && recordText[i + 1] === '"') {
        i += 1;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }
    if (!inQuotes && ch === delimiter) count += 1;
  }
  return count;
}

function samplePhysicalRecords(text, limit = 20) {
  const records = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < text.length && records.length < limit; i += 1) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') {
        current += ch + text[i + 1];
        i += 1;
      } else {
        inQuotes = !inQuotes;
        current += ch;
      }
      continue;
    }
    const newline = normalizeNewline(ch, text, i);
    if (!inQuotes && newline.isNewline) {
      records.push(current);
      current = "";
      i = newline.nextIndex;
      continue;
    }
    current += ch;
  }
  if (current.length > 0) records.push(current);
  return records.filter((line) => line.trim().length > 0);
}

function detectDelimiter(text) {
  const candidates = [",", "\t", ";", "|"];
  const sample = samplePhysicalRecords(text.slice(0, Math.min(text.length, 256 * 1024)));
  let best = ",";
  let bestScore = -Infinity;

  for (const delimiter of candidates) {
    const counts = sample.map((line) => countDelimiterOutsideQuotes(line, delimiter));
    const nonZero = counts.filter((count) => count > 0);
    if (nonZero.length === 0) continue;
    const avg = nonZero.reduce((sum, count) => sum + count, 0) / nonZero.length;
    const variance =
      nonZero.reduce((sum, count) => sum + Math.abs(count - avg), 0) / Math.max(1, nonZero.length);
    const consistency = nonZero.length / Math.max(1, sample.length);
    const score = avg * 4 + consistency * 8 - variance * 3;
    if (score > bestScore) {
      best = delimiter;
      bestScore = score;
    }
  }

  return best;
}

function normalizeHeaders(rawHeaders, columnCount) {
  const used = new Map();
  const headers = [];
  for (let i = 0; i < columnCount; i += 1) {
    const raw = rawHeaders[i] == null || rawHeaders[i] === "" ? `Column ${i + 1}` : String(rawHeaders[i]);
    const seen = used.get(raw) || 0;
    used.set(raw, seen + 1);
    headers.push(seen === 0 ? raw : `${raw} (${seen + 1})`);
  }
  return headers;
}

function buildIssueSummary(type, rowNumber, columnIndex, columnName, detail, sample) {
  return {
    type,
    rowNumber,
    columnIndex,
    columnName,
    detail,
    sample: sample == null ? "" : String(sample).slice(0, 300),
  };
}

function detectDuplicateColumns(rawHeaders) {
  const groups = new Map();
  rawHeaders.forEach((header, index) => {
    const name = header == null || header === "" ? `Column ${index + 1}` : String(header);
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(index);
  });
  return [...groups.entries()]
    .filter(([, indexes]) => indexes.length > 1)
    .map(([columnName, columnIndexes]) => ({
      type: "重复列名",
      rowNumber: 1,
      columnIndex: columnIndexes[0],
      columnIndexes,
      columnName,
      detail: `列名出现 ${columnIndexes.length} 次：${columnIndexes.map((index) => index + 1).join(", ")}`,
      sample: columnName,
    }));
}

function getMaxRecordColumns(records, minimumColumns = 0) {
  let maxColumns = minimumColumns;
  for (const row of records) {
    if (row.length > maxColumns) maxColumns = row.length;
  }
  return maxColumns;
}

function getFormulaNestingDepth(value) {
  const text = String(value == null ? "" : value);
  let depth = 0;
  for (let index = 0; index < text.length; index += 1) {
    const ch = text[index];
    if (ch === "(" || ch === "[" || ch === "{") depth += 1;
    if (ch === ")" || ch === "]" || ch === "}") depth = Math.max(0, depth - 1);
  }
  return depth;
}

function repairFormulaRecord(record, expectedColumns, delimiter) {
  if (!expectedColumns || record.length <= expectedColumns) return record;
  const repaired = [];
  let changed = false;

  for (let index = 0; index < record.length; index += 1) {
    const remainingOutput = expectedColumns - repaired.length;
    const remainingFields = record.length - index;
    if (remainingFields === remainingOutput) {
      repaired.push(...record.slice(index));
      break;
    }

    const startIndex = index;
    let value = record[index];
    if (String(value == null ? "" : value).trimStart().startsWith("=")) {
      let depth = getFormulaNestingDepth(value);
      while (
        depth > 0 &&
        index + 1 < record.length &&
        record.length - (index + 2) >= remainingOutput - 1
      ) {
        index += 1;
        value += delimiter + record[index];
        depth = getFormulaNestingDepth(value);
      }
      if (depth === 0 && index > startIndex) {
        repaired.push(value);
        changed = true;
        continue;
      }
      index = startIndex;
    }

    repaired.push(record[index]);
  }

  return changed && repaired.length === expectedColumns ? repaired : record;
}

function parseCsvText(text, options = {}) {
  const delimiter = options.delimiter || detectDelimiter(text);
  const previewLimit = options.previewLimit || DEFAULT_PREVIEW_LIMIT;
  const longFieldThreshold = options.longFieldThreshold || DEFAULT_LONG_FIELD_THRESHOLD;
  const records = [];
  let field = "";
  let record = [];
  let inQuotes = false;
  let started = false;
  let lastProgressAt = 0;
  const progressEvery = Math.max(1024 * 256, Math.floor(text.length / 100));

  for (let i = 0; i < text.length; i += 1) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') {
        field += '"';
        i += 1;
      } else {
        inQuotes = !inQuotes;
      }
      started = true;
      continue;
    }

    if (!inQuotes && ch === delimiter) {
      record.push(field);
      field = "";
      started = true;
      continue;
    }

    const newline = normalizeNewline(ch, text, i);
    if (!inQuotes && newline.isNewline) {
      record.push(field);
      records.push(record);
      field = "";
      record = [];
      started = false;
      i = newline.nextIndex;
      continue;
    }

    field += ch;
    started = true;

    if (options.onProgress && i - lastProgressAt >= progressEvery) {
      lastProgressAt = i;
      options.onProgress(Math.min(0.98, i / Math.max(1, text.length)));
    }
  }

  if (started || field.length > 0 || record.length > 0) {
    record.push(field);
    records.push(record);
  }

  const nonEmptyRecords = records.filter((row, index) => {
    if (index === 0) return true;
    return row.some((cell) => cell !== "");
  });
  const rawHeaders = nonEmptyRecords[0] || [];
  const expectedColumns = rawHeaders.length;
  const recordsForAnalysis = expectedColumns
    ? [rawHeaders, ...nonEmptyRecords.slice(1).map((row) => repairFormulaRecord(row, expectedColumns, delimiter))]
    : nonEmptyRecords;
  const maxColumns = getMaxRecordColumns(recordsForAnalysis, expectedColumns);
  const headers = normalizeHeaders(rawHeaders, maxColumns);
  const rows = [];
  const issues = {
    inconsistentRows: [],
    sparseRows: [],
    longFields: [],
    duplicateColumns: detectDuplicateColumns(rawHeaders),
  };

  for (let i = 1; i < recordsForAnalysis.length; i += 1) {
    const rawRow = recordsForAnalysis[i];
    const rowNumber = i + 1;
    if (expectedColumns > 0 && rawRow.length !== expectedColumns) {
      issues.inconsistentRows.push(
        buildIssueSummary(
          "列数不一致",
          rowNumber,
          -1,
          "",
          `期望 ${expectedColumns} 列，实际 ${rawRow.length} 列`,
          rawRow.join(delimiter),
        ),
      );
    }

    const emptyCount = rawRow.filter((cell) => cell === "").length + Math.max(0, maxColumns - rawRow.length);
    if (maxColumns > 1 && emptyCount / maxColumns >= EMPTY_RATIO_THRESHOLD) {
      issues.sparseRows.push(
        buildIssueSummary(
          "空字段比例高",
          rowNumber,
          -1,
          "",
          `空字段 ${emptyCount}/${maxColumns}`,
          rawRow.join(delimiter),
        ),
      );
    }

    for (let col = 0; col < rawRow.length; col += 1) {
      const value = rawRow[col] == null ? "" : String(rawRow[col]);
      if (value.length >= longFieldThreshold) {
        issues.longFields.push(
          buildIssueSummary(
            "超长字段",
            rowNumber,
            col,
            headers[col] || `Column ${col + 1}`,
            `${value.length} 字符`,
            value,
          ),
        );
      }
    }

    const padded = Array.from({ length: maxColumns }, (_, col) => rawRow[col] == null ? "" : String(rawRow[col]));
    rows.push(padded);
  }

  return {
    headers,
    rows,
    issues,
    meta: {
      rowCount: rows.length,
      columnCount: headers.length,
      delimiter,
      previewLimit,
      longFieldThreshold,
    },
  };
}

function decodeBuffer(buffer, encodingPreference = "auto") {
  const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
  if (encodingPreference !== "auto") {
    return {
      text: new TextDecoder(encodingPreference).decode(bytes),
      encoding: encodingPreference.toUpperCase(),
    };
  }

  try {
    return {
      text: new TextDecoder("utf-8", { fatal: true }).decode(bytes),
      encoding: "UTF-8",
    };
  } catch (error) {
    const labels = ["gb18030", "gbk"];
    for (const label of labels) {
      try {
        return {
          text: new TextDecoder(label).decode(bytes),
          encoding: "GB18030/GBK",
        };
      } catch (innerError) {
        continue;
      }
    }
    return {
      text: new TextDecoder("utf-8").decode(bytes),
      encoding: "UTF-8 (replacement)",
    };
  }
}

self.__CSV_CORE__ = {
  detectDelimiter,
  parseCsvText,
  decodeBuffer,
};

self.onmessage = (event) => {
  const message = event.data || {};
  if (message.kind !== "parse-csv") return;

  const startedAt = Date.now();
  try {
    self.postMessage({ type: "progress", stage: "解码文件", progress: 0.04 });
    const decoded = decodeBuffer(message.buffer, message.encoding || "auto");
    self.postMessage({ type: "progress", stage: "识别分隔符", progress: 0.1 });
    const delimiter = message.delimiter || detectDelimiter(decoded.text);
    const result = parseCsvText(decoded.text, {
      delimiter,
      previewLimit: message.previewLimit || DEFAULT_PREVIEW_LIMIT,
      longFieldThreshold: message.longFieldThreshold || DEFAULT_LONG_FIELD_THRESHOLD,
      onProgress(progress) {
        self.postMessage({
          type: "progress",
          stage: "解析 CSV",
          progress: 0.1 + progress * 0.86,
        });
      },
    });
    result.file = {
      name: message.fileName,
      size: message.fileSize,
      encoding: decoded.encoding,
      delimiter,
      parseMs: Date.now() - startedAt,
      kind: "CSV",
    };
    self.postMessage({ type: "complete", result });
  } catch (error) {
    self.postMessage({
      type: "error",
      message: error && error.message ? error.message : String(error),
    });
  }
};
    </script>
