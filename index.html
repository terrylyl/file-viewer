      function reindexColumnSet(columns, removedColumnIndex) {
        const next = new Set();
        for (const columnIndex of columns) {
          if (columnIndex < removedColumnIndex) next.add(columnIndex);
          if (columnIndex > removedColumnIndex) next.add(columnIndex - 1);
        }
        return next;
      }

      function reindexColumnFilters(filters, removedColumnIndex) {
        const next = {};
        for (const [columnKey, filter] of Object.entries(filters)) {
          const columnIndex = Number(columnKey);
          if (columnIndex === removedColumnIndex) continue;
          const nextIndex = columnIndex > removedColumnIndex ? columnIndex - 1 : columnIndex;
          next[String(nextIndex)] = cloneColumnFilter(filter);
        }
        return next;
      }

      function reindexCellMeta(cellMeta, removedColumnIndex) {
        const next = new Map();
        for (const [key, meta] of cellMeta.entries()) {
          const [rowPart, columnPart] = key.split(":");
          const columnIndex = Number(columnPart);
          if (columnIndex === removedColumnIndex) continue;
          const nextColumnIndex = columnIndex > removedColumnIndex ? columnIndex - 1 : columnIndex;
          next.set(`${rowPart}:${nextColumnIndex}`, meta);
        }
        return next;
      }

      function reindexColumnOrder(order, removedColumnIndex) {
        return order
          .filter((columnIndex) => columnIndex !== removedColumnIndex)
          .map((columnIndex) => (columnIndex > removedColumnIndex ? columnIndex - 1 : columnIndex));
      }

      function normalizeSelectionAfterColumnDelete(removedColumnIndex) {
        if (!state.selected) return;
        if (!state.headers.length || !state.rows.length) {
          state.selected = null;
          return;
        }
        const rowIndex = Math.min(state.selected.rowIndex, state.rows.length - 1);
        let columnIndex = state.selected.columnIndex;
        if (columnIndex === removedColumnIndex) columnIndex = Math.min(removedColumnIndex, state.headers.length - 1);
        else if (columnIndex > removedColumnIndex) columnIndex -= 1;
        state.selected = { rowIndex, columnIndex };
        clearSelectionToSelected();
      }

      function addDerivedColumn({ name, mode, sourceColumnIndex }) {
        if (!state.headers.length) return;
        const columnIndex = state.headers.length;
        const columnName = String(name || "").trim() || getNextColumnName();
        state.headers.push(columnName);
        state.originalHeaders.push(columnName);

        const source = Number(sourceColumnIndex);
        const shouldCopy = mode === "copy" && Number.isInteger(source) && source >= 0 && source < columnIndex;
        state.rows.forEach((row, rowIndex) => {
          if (mode === "sequence") {
            row[columnIndex] = String(rowIndex + 1);
          } else if (shouldCopy) {
            row[columnIndex] = row[source] == null ? "" : String(row[source]);
          } else {
            row[columnIndex] = "";
          }
        });

        if (shouldCopy && state.cellMeta?.size) {
          const nextMeta = new Map(state.cellMeta);
          for (let rowIndex = 0; rowIndex < state.rows.length; rowIndex += 1) {
            const meta = nextMeta.get(`${rowIndex}:${source}`);
            if (meta) nextMeta.set(`${rowIndex}:${columnIndex}`, { ...meta });
          }
          state.cellMeta = nextMeta;
        }

        state.visibleColumns[columnIndex] = true;
        state.customColumns.add(columnIndex);
        state.columnOrder = state.columnOrder.length
          ? [...state.columnOrder, columnIndex]
          : state.headers.map((_, index) => index);
        state.columnWidths[columnIndex] = Math.max(
          MIN_COL_WIDTH,
          Math.min(MAX_COL_WIDTH, Math.max(DEFAULT_COL_WIDTH, columnName.length * 10 + 36)),
        );
        invalidateColumnValueCache();
        state.issues = analyzeRows(state.headers, state.rows);
        state.selected = state.rows.length ? { rowIndex: 0, columnIndex } : null;
        clearSelectionToSelected();
        updateSearchColumns();
        renderColumnPopover();
        renderColumnOverview();
        updateFileStats();
        recomputeView();
        renderDetail();
        closeAddColumnPopover();
        els.leftStatus.textContent = `已添加列：${columnName}`;
      }

      function addConcatenatedColumn({ name, items }) {
        if (!state.headers.length || !items.length) return;
        const columnIndex = state.headers.length;
        const columnName = String(name || "").trim() || "用户问题";
        saveConcatenateScheme({ name: columnName, items });
        state.headers.push(columnName);
        state.originalHeaders.push(columnName);
        state.rows.forEach((row) => {
          row[columnIndex] = buildConcatenatedValue(items, row);
        });
        state.visibleColumns[columnIndex] = true;
        state.customColumns.add(columnIndex);
        state.columnOrder = state.columnOrder.length
          ? [...state.columnOrder, columnIndex]
          : state.headers.map((_, index) => index);
        state.columnWidths[columnIndex] = Math.max(
          MIN_COL_WIDTH,
          Math.min(MAX_COL_WIDTH, Math.max(DEFAULT_COL_WIDTH, columnName.length * 10 + 36)),
        );
        invalidateColumnValueCache();
        state.issues = analyzeRows(state.headers, state.rows);
        state.selected = state.rows.length ? { rowIndex: 0, columnIndex } : null;
        clearSelectionToSelected();
        recomputeView();
        refreshColumnDependentViews();
        closeConcatenateColumnPopover();
        els.leftStatus.textContent = `已生成拼接列：${columnName}`;
      }

      function renameColumn(columnIndex, name) {
        if (!Number.isInteger(columnIndex) || columnIndex < 0 || columnIndex >= state.headers.length) return;
        const nextName = String(name || "").trim() || `Column ${columnIndex + 1}`;
        state.headers[columnIndex] = nextName;
        state.issues = {
          ...state.issues,
          duplicateColumns: detectDuplicateHeaderIssues(state.headers),
        };
        if (state.columnFilterMenu.columnIndex === columnIndex) {
          els.columnFilterTitle.textContent = `${columnIndex + 1}. ${nextName}`;
          els.renameColumnInput.value = nextName;
          els.restoreColumnNameButton.disabled = nextName === state.originalHeaders[columnIndex];
        }
        refreshColumnDependentViews();
        renderColumnFilterValues();
        els.leftStatus.textContent = `已重命名列：${nextName}`;
      }

      function restoreColumnName(columnIndex) {
        if (!Number.isInteger(columnIndex) || columnIndex < 0 || columnIndex >= state.headers.length) return;
        renameColumn(columnIndex, state.originalHeaders[columnIndex] || `Column ${columnIndex + 1}`);
      }

      function deleteCustomColumn(columnIndex) {
        if (!isCustomColumn(columnIndex)) return;
        const removedName = state.headers[columnIndex] || `Column ${columnIndex + 1}`;
        state.headers.splice(columnIndex, 1);
        state.originalHeaders.splice(columnIndex, 1);
        state.rows.forEach((row) => row.splice(columnIndex, 1));
        state.visibleColumns.splice(columnIndex, 1);
        state.columnWidths.splice(columnIndex, 1);
        state.columnOrder = reindexColumnOrder(state.columnOrder, columnIndex);
        state.columnFilters = reindexColumnFilters(state.columnFilters, columnIndex);
        state.customColumns = reindexColumnSet(state.customColumns, columnIndex);
        state.cellMeta = reindexCellMeta(state.cellMeta, columnIndex);
        invalidateColumnValueCache();
        if (state.sort.column === columnIndex) state.sort = { column: -1, direction: "none" };
        else if (state.sort.column > columnIndex) state.sort.column -= 1;
        normalizeSelectionAfterColumnDelete(columnIndex);
        state.issues = analyzeRows(state.headers, state.rows);
        closeColumnFilterMenu();
        updateSearchColumns();
        renderColumnPopover();
        renderColumnOverview();
        updateFileStats();
        recomputeView();
        renderDetail();
        els.leftStatus.textContent = `已删除自定义列：${removedName}`;

      function updateFileStats() {
        els.fileStats.innerHTML = "";
        if (!state.file) return;
        const issueCount =
          state.issues.inconsistentRows.length +
          state.issues.sparseRows.length +
          state.issues.longFields.length +

        const stats = [
          state.file.name,
          formatBytes(state.file.size),
          `${state.rows.length.toLocaleString()} 行`,
          `${state.headers.length.toLocaleString()} 列`,
          state.file.encoding,
          state.file.kind === "CSV" ? delimiterLabel(state.file.delimiter) : state.file.delimiter,
          state.file.sheetCount ? `${state.file.sheetCount} sheets` : "",

        ].filter(Boolean);
        for (const stat of stats) {

          els.fileStats.appendChild(pill);

        els.fileStats.appendChild(issuePill);
        if ((state.issues.duplicateColumns || []).length) {
          const duplicatePill = document.createElement("span");
          duplicatePill.className = "pill warning";
          duplicatePill.textContent = `重复列名 ${(state.issues.duplicateColumns || []).length}`;
          els.fileStats.appendChild(duplicatePill);

      function setDataset(result) {
        state.headers = result.headers || [];
        state.originalHeaders = [...state.headers];
        state.rows = result.rows || [];
        state.issues = result.issues || { inconsistentRows: [], sparseRows: [], longFields: [], duplicateColumns: [] };
        state.cellMeta = result.cellMeta instanceof Map ? result.cellMeta : new Map();
        state.file = result.file || null;
        state.visibleColumns = state.headers.map(() => true);
        state.columnOrder = state.headers.map((_, index) => index);
        state.columnWidths = state.headers.map((header) =>
          Math.max(MIN_COL_WIDTH, Math.min(MAX_COL_WIDTH, Math.max(DEFAULT_COL_WIDTH, String(header).length * 10 + 36))),
        );
        clearAllColumnFilters();
        invalidateColumnValueCache();
        state.customColumns = new Set();
        state.concatenateColumnItems = [];
        state.concatenateDragIndex = -1;
        state.dragColumn = null;
        state.hiddenRows = new Set();
        state.columnFilterMenu = { columnIndex: -1, query: "" };
        state.sort = { column: -1, direction: "none" };
        state.selected = state.rows.length && state.headers.length ? { rowIndex: 0, columnIndex: 0 } : null;

      function updateSheetSelect(sheetNames = [], activeSheetName = "") {
        state.excelSheetNames = sheetNames;
        state.activeSheetName = activeSheetName;

      function resetExcelWorkbook() {
        state.excelWorkbook = null;
        state.excelXLSX = null;
        state.excelFile = null;
        updateSheetSelect([], "");
      }

      function buildExcelDatasetFromSheet(sheetName, startedAt = Date.now()) {
        if (!state.excelWorkbook || !state.excelXLSX || !state.excelFile) {
          throw new Error("未加载 Excel 工作簿");
        }
        const sheet = state.excelWorkbook.Sheets[sheetName];
        if (!sheet) throw new Error(`未找到 Sheet：${sheetName}`);
        const XLSX = state.excelXLSX;
        const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
        const maxColumns = getMatrixColumnCount(matrix);
        const rawHeaders = matrix[0] || [];
        const headers = Array.from({ length: maxColumns }, (_, index) => {
          const value = rawHeaders[index] == null || rawHeaders[index] === "" ? `Column ${index + 1}` : String(rawHeaders[index]);
          return value;
        });
        const rows = matrix.slice(1).map((row) =>
          Array.from({ length: maxColumns }, (_, index) => (row[index] == null ? "" : String(row[index]))),
        );
        return {
          headers,
          rows,
          cellMeta: collectExcelCellMeta(sheet, matrix.length, maxColumns, XLSX),
          issues: analyzeRows(headers, rows),
          file: {
            name: state.excelFile.name,
            size: state.excelFile.size,
            encoding: "Excel workbook",
            delimiter: sheetName,
            parseMs: Date.now() - startedAt,
            kind: "Excel",
            sheetCount: state.excelSheetNames.length,
          },
        };
      }

      function loadExcelSheet(sheetName, startedAt = Date.now(), loadToken = state.loadToken) {
        if (!sheetName) return;
        if (!isCurrentLoad(loadToken)) return;
        try {
          setProgress(0.58, `转换 Sheet：${sheetName}`);
          updateSheetSelect(state.excelSheetNames, sheetName);
          const result = buildExcelDatasetFromSheet(sheetName, startedAt);
          if (!isCurrentLoad(loadToken)) return;
          setDataset(result);
        } catch (error) {
          if (!isCurrentLoad(loadToken)) return;
          setProgress(0, `Excel Sheet 读取失败：${error.message}`);
          els.emptyState.style.display = "grid";
          els.emptyState.querySelector("strong").textContent = "Excel Sheet 读取失败";
          els.emptyState.querySelector("span").textContent = error.message;
        }
      }

      async function parseCsvFile(file) {
        const loadToken = beginLoad();
        resetExcelWorkbook();
        setProgress(0.02, "读取文件");
        els.emptyState.style.display = "grid";
        els.emptyState.querySelector("strong").textContent = "正在解析";
        els.emptyState.querySelector("span").textContent = file.name;
        const buffer = await file.arrayBuffer();
        if (!isCurrentLoad(loadToken)) return;

        const worker = createCsvWorker();
        state.worker = worker;
        worker.onmessage = (event) => {
          if (!isCurrentLoad(loadToken)) return;
          const message = event.data || {};
          if (message.type === "progress") {
            setProgress(message.progress, message.stage);
          } else if (message.type === "complete") {
            setDataset(message.result);
            worker.terminate();
            if (state.worker === worker) state.worker = null;
          } else if (message.type === "error") {
            setProgress(0, `解析失败：${message.message}`);
            worker.terminate();
            if (state.worker === worker) state.worker = null;
          }
        };

        worker.postMessage(
          {
            kind: "parse-csv",
            fileName: file.name,
            fileSize: file.size,
            encoding: els.encodingSelect.value,
            previewLimit: PREVIEW_LIMIT,
            longFieldThreshold: 50000,
            buffer,
          },
          [buffer],
        );
      }

      async function ensureSheetJs() {
        if (window.XLSX) return window.XLSX;
        const sources = [
          "vendor/xlsx.full.min.js",
          "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
        ];
        for (const source of sources) {
          try {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = source;
              script.async = true;
              script.onload = resolve;
              script.onerror = () => reject(new Error(`加载失败：${source}`));
              document.head.appendChild(script);
            });
            if (window.XLSX) return window.XLSX;
          } catch (error) {
            continue;
          }
        }
        throw new Error("无法加载 SheetJS，Excel 读取或 XLSX 导出需要网络或 vendor/xlsx.full.min.js");
      }

      function normalizeExcelColor(color) {
        if (!color) return "";
        if (typeof color === "string") {
          const value = color.trim().replace(/^#/, "");
          if (/^[0-9a-f]{8}$/i.test(value)) return `#${value.slice(2).toLowerCase()}`;
          if (/^[0-9a-f]{6}$/i.test(value)) return `#${value.toLowerCase()}`;
          return "";
        }
        if (color.rgb) {
          const value = String(color.rgb).trim().replace(/^#/, "");
          if (/^[0-9a-f]{8}$/i.test(value)) return `#${value.slice(2).toLowerCase()}`;
          if (/^[0-9a-f]{6}$/i.test(value)) return `#${value.toLowerCase()}`;
        }
        if (color.indexed != null && Object.prototype.hasOwnProperty.call(EXCEL_INDEXED_COLORS, color.indexed)) {
          return EXCEL_INDEXED_COLORS[color.indexed];
        }
        return "";
      }

      function getExcelCell(sheet, rowIndex, columnIndex, XLSX) {
        if (Array.isArray(sheet)) return sheet[rowIndex]?.[columnIndex] || null;
        if (Array.isArray(sheet["!data"])) return sheet["!data"][rowIndex]?.[columnIndex] || null;
        return sheet[XLSX.utils.encode_cell({ r: rowIndex, c: columnIndex })] || null;
      }

      function extractExcelCellMeta(cell) {
        if (!cell) return null;
        const style = typeof cell.s === "object" && cell.s ? cell.s : {};
        const fill = style.fill || style.patternFill || {};
        const font = style.font || {};
        const backgroundColor = normalizeExcelColor(fill.fgColor || fill.bgColor || style.fgColor || style.bgColor);
        const color = normalizeExcelColor(font.color || style.color);
        const html = typeof cell.h === "string" && /<[^>]+>/.test(cell.h) ? cell.h : "";
        const link = normalizeLinkHref(cell.l?.Target || "");
        const meta = {};
        if (backgroundColor && backgroundColor !== "#ffffff") meta.backgroundColor = backgroundColor;
        if (color) meta.color = color;
        if (html) meta.html = html;
        if (link) meta.link = link;
        return Object.keys(meta).length ? meta : null;
      }

      function collectExcelCellMeta(sheet, rowCount, columnCount, XLSX) {
        const cellMeta = new Map();
        for (let row = 1; row < rowCount; row += 1) {
          for (let col = 0; col < columnCount; col += 1) {
            const meta = extractExcelCellMeta(getExcelCell(sheet, row, col, XLSX));
            if (meta) cellMeta.set(`${row - 1}:${col}`, meta);
          }
        }
        return cellMeta;
      }

      function getMatrixColumnCount(matrix) {
        let maxColumns = 0;
        for (const row of matrix) {
          const columnCount = Array.isArray(row) ? row.length : 0;
          if (columnCount > maxColumns) maxColumns = columnCount;
        }
        return maxColumns;
      }

      function detectDuplicateHeaderIssues(headers) {
        const groups = new Map();
        headers.forEach((header, index) => {
          const name = header == null || header === "" ? `Column ${index + 1}` : String(header);
          if (!groups.has(name)) groups.set(name, []);
          groups.get(name).push(index);
        });
        return [...groups.entries()]
          .filter(([, indexes]) => indexes.length > 1)
          .map(([columnName, columnIndexes]) => ({
            type: "重复列名",
            rowNumber: 1,
            columnIndex: columnIndexes[0],
            columnIndexes,
            columnName,
            detail: `列名出现 ${columnIndexes.length} 次：${columnIndexes.map((index) => index + 1).join(", ")}`,
            sample: columnName,
          }));
      }

      function appendRowIssues(issues, headers, row, index) {
        if (!row) return;
        const expected = headers.length;
        const rowNumber = index + 2;
        if (row.length !== expected) {
          issues.inconsistentRows.push({
            type: "列数不一致",
            rowNumber,
            columnIndex: -1,
            columnName: "",
            detail: `期望 ${expected} 列，实际 ${row.length} 列`,
            sample: row.join(",").slice(0, 300),
          });
        }
        const emptyCount = row.filter((cell) => cell === "").length;
        if (expected > 1 && emptyCount / expected >= 0.6) {
          issues.sparseRows.push({
            type: "空字段比例高",
            rowNumber,
            columnIndex: -1,
            columnName: "",
            detail: `空字段 ${emptyCount}/${expected}`,
            sample: row.join(",").slice(0, 300),
          });
        }
        row.forEach((cell, col) => {
          const text = cell == null ? "" : String(cell);
          if (text.length >= 50000) {
            issues.longFields.push({
              type: "超长字段",
              rowNumber,
              columnIndex: col,
              columnName: headers[col] || `Column ${col + 1}`,
              detail: `${text.length} 字符`,
              sample: text.slice(0, 300),
            });
          }
        });
      }

      function analyzeRows(headers, rows) {
        const issues = { inconsistentRows: [], sparseRows: [], longFields: [], duplicateColumns: detectDuplicateHeaderIssues(headers) };
        rows.forEach((row, index) => appendRowIssues(issues, headers, row, index));
        return issues;
      }

      function refreshIssuesAfterCellEdits(rowIndexes) {
        const touchedRows = new Set([...rowIndexes].filter((rowIndex) => Number.isInteger(rowIndex) && rowIndex >= 0));
        const keepUntouchedRowIssue = (issue) => !touchedRows.has((issue.rowNumber || 0) - 2);
        state.issues = {
          duplicateColumns: detectDuplicateHeaderIssues(state.headers),
          inconsistentRows: (state.issues.inconsistentRows || []).filter(keepUntouchedRowIssue),
          sparseRows: (state.issues.sparseRows || []).filter(keepUntouchedRowIssue),
          longFields: (state.issues.longFields || []).filter(keepUntouchedRowIssue),
        };
        [...touchedRows]
          .sort((left, right) => left - right)
          .forEach((rowIndex) => appendRowIssues(state.issues, state.headers, state.rows[rowIndex], rowIndex));
      }

      async function parseExcelFile(file) {
        const loadToken = beginLoad();
        const startedAt = Date.now();
        setProgress(0.05, "加载 Excel 解析器");
        try {
          resetExcelWorkbook();
          const XLSX = await ensureSheetJs();
          if (!isCurrentLoad(loadToken)) return;
          setProgress(0.2, "读取 Excel");
          const buffer = await file.arrayBuffer();
          if (!isCurrentLoad(loadToken)) return;
          const workbook = XLSX.read(buffer, { type: "array", cellDates: false, dense: true, cellStyles: true, cellHTML: true });
          if (!isCurrentLoad(loadToken)) return;
          const sheetName = workbook.SheetNames[0];
          if (!sheetName) throw new Error("工作簿中没有可读取的 Sheet");
          state.excelWorkbook = workbook;
          state.excelXLSX = XLSX;
          state.excelFile = file;
          updateSheetSelect(workbook.SheetNames, sheetName);
          loadExcelSheet(sheetName, startedAt, loadToken);
        } catch (error) {
          if (!isCurrentLoad(loadToken)) return;
          setProgress(0, `Excel 解析失败：${error.message}`);
          els.emptyState.style.display = "grid";
          els.emptyState.querySelector("strong").textContent = "Excel 解析失败";
          els.emptyState.querySelector("span").textContent = error.message;
        }
      }

      async function openFileWithPicker() {
        if (!window.showOpenFilePicker) {
          els.fileInput.click();
          return;
        }
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [
              {
                description: "Table files",
                accept: {
                  "text/csv": [".csv", ".tsv", ".txt"],
                  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"],
                  "application/vnd.ms-excel": [".xls"],
                },
              },
            ],
          });
          if (!handle) return;
          const file = await handle.getFile();
          handleFiles([file], handle);
        } catch (error) {
          if (!error || error.name !== "AbortError") {
            els.fileInput.click();
          }
        }
      }

      function handleFiles(files, sourceFileHandle = null) {
        const file = files && files[0];
        if (!file) return;
        const lower = file.name.toLocaleLowerCase();
        els.fileHint.textContent = file.name;
        els.fileHint.title = file.name;
        state.sourceFileHandle = sourceFileHandle;
        els.searchInput.value = "";
        els.detailSearchInput.value = "";
        els.modalSearchInput.value = "";
        closeClipboardImportPopover();
        if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
          parseExcelFile(file);
        } else {
          parseCsvFile(file);
        }
      }

      function getExportSplitCount() {
        const value = Math.floor(Number(els.exportSplitCountInput.value));
        const splitCount = Number.isFinite(value) && value > 0 ? value : 1;
        els.exportSplitCountInput.value = String(splitCount);
        return splitCount;
      }

      function getFilteredExportRowGroups() {
        const rowIndexes = [...state.viewIndices];
        if (!rowIndexes.length) return [];
        const splitCount = Math.min(getExportSplitCount(), rowIndexes.length);
        const rowsPerPart = Math.ceil(rowIndexes.length / splitCount);
        const groups = [];
        for (let index = 0; index < rowIndexes.length; index += rowsPerPart) {
          groups.push(rowIndexes.slice(index, index + rowsPerPart));
        }
        return groups;
      }

      async function exportFilteredCsv(rowIndexes = state.viewIndices, suffix = "") {
        if (!state.rows.length) return;
        const visibleColumns = getVisibleColumnIndexes();
        const parts = [visibleColumns.map((col) => escapeCsv(state.headers[col])).join(",")];
        let chunk = [];
        for (const rowIndex of rowIndexes) {
          const row = state.rows[rowIndex];
          chunk.push("\r\n", visibleColumns.map((col) => escapeCsv(row[col] || "")).join(","));
          if (chunk.length >= 2000) {
            parts.push(chunk.join(""));
            chunk = [];
          }
        }
        if (chunk.length) parts.push(chunk.join(""));
        const base = state.file?.name ? state.file.name.replace(/\.[^.]+$/, "") : "filtered";
        await saveTextFile(`${base}-filtered${suffix}.csv`, parts);
      }

      function getFilteredExportMatrix(rowIndexes = state.viewIndices) {
        const visibleColumns = getVisibleColumnIndexes();
        const matrix = [visibleColumns.map((col) => state.headers[col])];
        for (const rowIndex of rowIndexes) {
          const row = state.rows[rowIndex];
          matrix.push(visibleColumns.map((col) => row[col] || ""));
        }
        return matrix;
      }

      async function exportFilteredXlsx(rowIndexes = state.viewIndices, suffix = "") {
        if (!state.rows.length) return;
        const XLSX = await ensureSheetJs();
        const matrix = getFilteredExportMatrix(rowIndexes);
        const worksheet = XLSX.utils.aoa_to_sheet(matrix);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Filtered");
        const base = state.file?.name ? state.file.name.replace(/\.[^.]+$/, "") : "filtered";
        XLSX.writeFile(workbook, `${base}-filtered${suffix}.xlsx`);
        els.leftStatus.textContent = "已导出 XLSX 文件";
      }

      async function exportFilteredTable() {
        try {
          const rowGroups = getFilteredExportRowGroups();
          for (let partIndex = 0; partIndex < rowGroups.length; partIndex += 1) {
            const suffix = rowGroups.length > 1 ? `_part${partIndex + 1}` : "";
            if (els.exportFormatSelect.value === "xlsx") {
              await exportFilteredXlsx(rowGroups[partIndex], suffix);
            } else {
              await exportFilteredCsv(rowGroups[partIndex], suffix);
            }
          }
          if (rowGroups.length > 1) els.leftStatus.textContent = `已导出 ${rowGroups.length} 个拆分文件`;
        } catch (error) {
          els.leftStatus.textContent = `导出失败：${error.message}`;
        }
      }

      function flattenIssues() {
        return [
          ...(state.issues.duplicateColumns || []),
          ...state.issues.inconsistentRows,
          ...state.issues.sparseRows,
          ...state.issues.longFields,
        ];
      }

      async function exportIssueReport() {
        const issues = flattenIssues();
        const lines = [["type", "rowNumber", "columnIndex", "columnName", "detail", "sample"].map(escapeCsv).join(",")];
        for (const issue of issues) {
          lines.push(
            [issue.type, issue.rowNumber, issue.columnIndex, issue.columnName, issue.detail, issue.sample]
              .map(escapeCsv)
              .join(","),
          );
        }
        const base = state.file?.name ? state.file.name.replace(/\.[^.]+$/, "") : "issues";
        await saveTextFile(`${base}-issues.csv`, lines.join("\r\n"));
      }

      function copySelectedRow() {
        if (!state.selected) return;
        const visibleColumns = getVisibleColumnIndexes();
        const row = state.rows[state.selected.rowIndex];
        copyText(visibleColumns.map((col) => row[col] || "").join("\t"));
      }

      function copySelectedHeader() {
        if (!state.selected) return;
        copyText(state.headers[state.selected.columnIndex] || "");
      }

      function toggleDetailPanel() {
        const collapsed = els.detailPanel.classList.toggle("collapsed");
        els.mainLayout.classList.toggle("detail-collapsed", collapsed);
        els.restoreDetailButton.hidden = !collapsed;
        if (!collapsed) renderDetail();
      }

      function debounce(fn, wait) {
        let timer = 0;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), wait);
        };
      }

      const debouncedSearch = debounce(() => {
        recomputeView();
        renderDetail();
      }, 180);

      const debouncedColumnFilterSearch = debounce(() => {
        state.columnFilterMenu.query = els.columnFilterSearchInput.value;
        renderColumnFilterValues();
      }, 120);

      els.chooseFileButton.addEventListener("click", openFileWithPicker);
      els.clipboardImportButton.addEventListener("click", (event) => openClipboardImportPopover(event.currentTarget));
      els.cancelClipboardImportButton.addEventListener("click", closeClipboardImportPopover);
      els.confirmClipboardImportButton.addEventListener("click", importClipboardTable);
      els.fileInput.addEventListener("change", (event) => handleFiles(event.target.files, null));
      els.dropZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        els.dropZone.classList.add("dragover");
      });
      els.dropZone.addEventListener("dragleave", () => els.dropZone.classList.remove("dragover"));
      els.dropZone.addEventListener("drop", (event) => {
        event.preventDefault();
        els.dropZone.classList.remove("dragover");
        handleFiles(event.dataTransfer.files, null);
      });

      els.gridViewport.addEventListener("scroll", renderGrid, { passive: true });
      els.gridViewport.addEventListener("keydown", handleGridKeyDown);
      els.searchInput.addEventListener("input", debouncedSearch);
      els.searchColumnSelect.addEventListener("change", recomputeView);
      els.sheetSelect.addEventListener("change", () => loadExcelSheet(els.sheetSelect.value));
      els.caseSensitiveInput.addEventListener("change", () => {
        recomputeView();
        renderDetail();
        renderModal();
      });
      els.matchedOnlyInput.addEventListener("change", recomputeView);
      els.wrapCellsInput.addEventListener("change", () => {
        state.wrapCells = els.wrapCellsInput.checked;
        els.gridViewport.scrollTop = 0;
        renderGrid();
      });
      els.clearSearchButton.addEventListener("click", () => {
        els.searchInput.value = "";
        els.matchedOnlyInput.checked = false;
        recomputeView();
      });
      els.clearAllFiltersButton.addEventListener("click", clearAllFilters);
      els.exportCsvButton.addEventListener("click", exportFilteredTable);
      els.exportIssuesButton.addEventListener("click", exportIssueReport);
      els.copyCellButton.addEventListener("click", () => copyText(getSelectionText()));
      els.openModalButton.addEventListener("click", () => {
        if (state.selected) openModalForCell(state.selected.rowIndex, state.selected.columnIndex);
      });
      els.detailSearchInput.addEventListener("input", () => {
        state.detailVisibleChars = DETAIL_CHUNK;
        renderDetail();
      });
      els.monoInput.addEventListener("change", renderDetail);
      els.loadMoreDetailButton.addEventListener("click", () => {
        state.detailVisibleChars += DETAIL_CHUNK;
        renderDetail();
      });
      els.closeModalButton.addEventListener("click", closeModal);
      els.modalBackdrop.addEventListener("click", (event) => {
        if (event.target === els.modalBackdrop) closeModal();
      });
      els.modalSearchInput.addEventListener("input", () => {
        state.modalVisibleChars = MODAL_CHUNK;
        renderModal();
      });
      els.modalMonoInput.addEventListener("change", renderModal);
      els.copyModalButton.addEventListener("click", () => {
        if (!state.modalCell) return;
        copyText(state.rows[state.modalCell.rowIndex]?.[state.modalCell.columnIndex] || "");
      });
      els.loadMoreModalButton.addEventListener("click", () => {
        state.modalVisibleChars += MODAL_CHUNK;
        renderModal();
      });

      els.columnsButton.addEventListener("click", (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        els.columnsPopover.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 310))}px`;
        els.columnsPopover.style.top = `${Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - 430))}px`;
        closeClipboardImportPopover();
        closeAddColumnPopover();
        closeConcatenateColumnPopover();
        els.columnsPopover.classList.toggle("open");
      });
      els.addColumnButton.addEventListener("click", (event) => openAddColumnPopover(event.currentTarget));
      els.concatenateColumnButton.addEventListener("click", (event) => openConcatenateColumnPopover(event.currentTarget));
      els.newColumnModeSelect.addEventListener("change", syncNewColumnMode);
      els.cancelAddColumnButton.addEventListener("click", closeAddColumnPopover);
      els.confirmAddColumnButton.addEventListener("click", () => {
        addDerivedColumn({
          name: els.newColumnNameInput.value,
          mode: els.newColumnModeSelect.value,
          sourceColumnIndex: Number(els.copyColumnSelect.value),
        });
      });
      els.addConcatenateRowButton.addEventListener("click", () => {
        state.concatenateColumnItems.push(createDefaultConcatenateItem(0));
        setConcatenateValidation();
        renderConcatenateRows();
      });
      els.cancelConcatenateColumnButton.addEventListener("click", closeConcatenateColumnPopover);
      els.applyConcatenateSchemeButton.addEventListener("click", applyConcatenateScheme);
      els.confirmConcatenateColumnButton.addEventListener("click", () => {
        const resolved = resolveConcatenateItems(state.concatenateColumnItems);
        if (resolved.errors.length) {
          setConcatenateValidation(resolved.errors);
          return;
        }
        addConcatenatedColumn({
          name: els.concatenateColumnNameInput.value,
          items: resolved.items,
        });
      });
      els.newColumnNameInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        els.confirmAddColumnButton.click();
      });
      els.showAllColumnsButton.addEventListener("click", () => {
        state.visibleColumns = state.headers.map(() => true);
        renderColumnPopover();
        renderGrid();
      });
      els.hideAllColumnsButton.addEventListener("click", () => {
        state.visibleColumns = state.headers.map(() => false);
        renderColumnPopover();
        renderGrid();
      });
      els.filterSortAscButton.addEventListener("click", () => {
        const columnIndex = state.columnFilterMenu.columnIndex;
        if (columnIndex < 0) return;
        state.sort = { column: columnIndex, direction: "asc" };
        recomputeView();
        closeColumnFilterMenu();
      });
      els.filterSortDescButton.addEventListener("click", () => {
        const columnIndex = state.columnFilterMenu.columnIndex;
        if (columnIndex < 0) return;
        state.sort = { column: columnIndex, direction: "desc" };
        recomputeView();
        closeColumnFilterMenu();
      });
      els.columnFilterSearchInput.addEventListener("input", debouncedColumnFilterSearch);
      els.clearColumnFilterButton.addEventListener("click", clearCurrentColumnFilter);
      els.selectAllFilterValuesButton.addEventListener("click", () => updateFilterValuesForVisible(true));
      els.selectNoFilterValuesButton.addEventListener("click", () => updateFilterValuesForVisible(false));
      els.hideFilteredRowsButton.addEventListener("click", hideRowsByCurrentColumnFilter);
      els.showHiddenRowsButton.addEventListener("click", showHiddenRows);
      els.renameColumnButton.addEventListener("click", () => renameColumn(state.columnFilterMenu.columnIndex, els.renameColumnInput.value));
      els.renameColumnInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        els.renameColumnButton.click();
      });
      els.restoreColumnNameButton.addEventListener("click", () => restoreColumnName(state.columnFilterMenu.columnIndex));
      els.deleteCustomColumnButton.addEventListener("click", () => deleteCustomColumn(state.columnFilterMenu.columnIndex));
      els.contextMenu.addEventListener("click", (event) => {
        const action = event.target.dataset.action;
        if (!action) return;
        if (action === "copy-cell") copyText(getSelectedValue());
        if (action === "copy-row") copySelectedRow();
        if (action === "copy-header") copySelectedHeader();
        if (action === "view-full" && state.selected) openModalForCell(state.selected.rowIndex, state.selected.columnIndex);
        closeContextMenu();
      });
      document.addEventListener("pointerdown", handleDocumentPointerDown);
      document.addEventListener("click", (event) => {
        if (!eventPathContains(event, els.columnsPopover) && !eventPathContains(event, els.columnsButton)) {
          els.columnsPopover.classList.remove("open");
        }
        if (!eventPathContains(event, els.clipboardImportPopover) && !eventPathContains(event, els.clipboardImportButton)) {
          closeClipboardImportPopover();
        }
        if (!eventPathContains(event, els.addColumnPopover) && !eventPathContains(event, els.addColumnButton)) {
          closeAddColumnPopover();
        }
        if (!eventPathContains(event, els.concatenateColumnPopover) && !eventPathContains(event, els.concatenateColumnButton)) {
          closeConcatenateColumnPopover();
        }
        if (!eventPathContains(event, els.columnFilterPopover) && !eventPathHasSelector(event, ".header-filter-button")) {
          closeColumnFilterMenu();
        }
        if (!eventPathContains(event, els.contextMenu)) closeContextMenu();
      });
      document.addEventListener("mousemove", onResizeMove);
      document.addEventListener("mouseup", stopResize);
      document.addEventListener("mouseup", stopSelectionDrag);
      document.addEventListener("keydown", handleCopyShortcut);
      document.addEventListener("paste", handlePasteIntoCustomColumns);
      window.addEventListener("blur", closeContextMenu);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeContextMenu();
          closeModal();
          els.columnsPopover.classList.remove("open");
          closeClipboardImportPopover();
          closeAddColumnPopover();
          closeConcatenateColumnPopover();
          closeColumnFilterMenu();
        }
      });
      els.toggleDetailButton.addEventListener("click", toggleDetailPanel);
      els.restoreDetailButton.addEventListener("click", toggleDetailPanel);

      renderColumnOverview();
      renderFilteredRowStats();
      renderGrid();
    </script>
  </body>
</html>
